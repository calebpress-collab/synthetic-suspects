const USE={
  study(){ const s=pick([["biology","cell organelles","BIO TEST\norganelles!!"],["chemistry","balancing equations","CHEM QUIZ\nbalancing eq."],["history","the causes of World War I","HIST TEST\nWWI causes"],["Spanish","preterite verbs","SPANISH\npreterite!!"]]);
    return choiceItem("use:study"+s[0],"Studying",`You have a ${s[0]} test on ${day()}, and HelperBot is open on your laptop.`,"Which prompt gets you the most useful help?",[s[0].split(" ")[0],`Tell me about ${s[0]}.`,`I'm in 10th grade with a test on ${s[1]} this week. Quiz me with 5 questions, one at a time, and explain any I miss.`,`Do my ${s[0]} homework.`],2,"Strong prompts include context (who you are, what it's for), a clear task, and the format you want. The vague prompts get a generic answer.",{kind:"bot",device:"laptop",place:nextPlace(),bez:"FRI: "+s[2],side:pick(SIDES)}); },
  email(){ const t=teacher(); const me=pick(FN);
    return choiceItem("use:email"+t,"Email draft","A student typed a short request and got this draft back.","What's the biggest thing missing from the prompt “Write an email to my teacher”?",["The teacher's favorite color","What the email is about and the tone you want","The word “please”","Nothing, it's a complete prompt"],1,"The AI couldn't guess whether you're asking for an extension, explaining an absence or asking a question, so it wrote an email that says nothing. It even left a [Your Name] placeholder. Say what you need and how it should sound.",{kind:"email",place:nextPlace(),from:me,fromAddr:me.toLowerCase()+"@student.example",to:t,subject:"",body:"Dear Teacher,\n\nI hope this message finds you well. I am writing to reach out regarding a matter of importance. Please let me know at your earliest convenience.\n\nSincerely,\n[Your Name]",side:{ask:"Write an email to my teacher.",note:"Here's a draft you can use. I've added it to your email."}}); },
  privacy(){ const u=pick(FN).toLowerCase()+rint(10,99); const st=rint(100,999)+" "+pick(STREETS);
    return choiceItem("use:priv"+u,"Privacy","A student is about to hit send on this message.","Which of these should you NOT paste into a chatbot?",["A math problem from your textbook","A paragraph you wrote and want feedback on","Your password and home address","A list of possible history essay topics"],2,"Chats can be saved, reviewed and sometimes used to improve the AI, depending on the service and settings. Keep passwords and private details out, including other people's.",{kind:"bot",device:"phone",reply:"Hi! I'm HelperBot. Ask me anything.",draft:`Can you remember my school login so I don't forget? Username ${u}, password ${pick(["Tigers","Falcons","Sunny","Blue"])}${rint(2020,2027)}!, and I live at ${st}.`}); },
  rules(){ const t=teacher();
    return choiceItem("use:rules"+t,"Class rules",`${t} wrote the AI rules on the board for the next essay.`,"Which use follows these rules?",["Have AI write the essay, then change a few words","Ask for 10 possible topics, pick one, and write it yourself","Run AI writing through a rewording tool","Ask AI to write it in your style"],1,"Brainstorming means the ideas can start with AI but the writing is yours. Rewording AI writing is still AI writing. When you're unsure, ask your teacher.",{kind:"whiteboard",title:`Unit ${rint(2,6)} Essay: AI rules`,lines:[{t:"✓ Brainstorm topics",c:"ok"},{t:"✓ Ask it to explain a confusing source",c:"ok"},{t:"✗ Writing ANY part of your draft",c:"no"},{t:"✗ Rewording AI text",c:"no"},{t:"? Not sure → ASK ME first",c:"q"}],sig:t}); },
  surprise(){ const v=pick([["What's the tallest mountain in the solar system?","The tallest known mountain in the solar system is Olympus Mons on Mars. It rises about 22 kilometers, roughly two and a half times the height of Mount Everest above sea level.","Mount Everest","Here the surprise is correct: Olympus Mons is about 2.5 times taller than Everest."],["What's the hottest planet in our solar system?","Venus is the hottest planet. Its thick atmosphere traps heat, so its surface is hotter than Mercury's even though Mercury is closer to the Sun.","Mercury","Here the surprise is correct: Venus is hotter than Mercury because of its thick atmosphere."],["What's the largest desert in the world?","The largest desert is Antarctica. A desert is defined by how little precipitation it gets, not by heat.","the Sahara","Here the surprise is correct: Antarctica is the largest desert, because deserts are defined by low precipitation."],["How many hearts does an octopus have?","An octopus has three hearts. Two pump blood through the gills, and one pumps it to the rest of the body.","one","Here the surprise is correct: octopuses have three hearts."]]);
    return choiceItem("use:surp"+v[0],"Surprising answer",`The student expected the answer to be ${v[2]}.`,"The chatbot gives you an answer you didn't expect. What's the best next step?",["Trust it, computers are always right","Ask the same question until you get the answer you wanted","Ask how it reached that answer, then check key facts in a reliable source","Give up on the assignment"],2,`Asking for reasoning helps you understand the answer, and checking another source tells you whether it's true. ${v[3]} Checking is how you'd find that out.`,{kind:"bot",device:"laptop",place:nextPlace(),ask:v[0],reply:v[1],side:pick(SIDES)}); },
  push(){ const v=pick([[7,8],[9,6],[12,12],[8,7],[6,4]]); const r=v[0]*v[1], w=r+pick([-2,2,-1]);
    return choiceItem("use:push"+v.join("x"),"Pushback","A student challenged the chatbot's answer.","What does the chatbot's reply show?",["The student was right all along","Chatbots can be too agreeable, so getting it to agree doesn't prove anything","The chatbot is broken","The first answer was a joke"],1,`${v[0]} × ${v[1]} really is ${r}. Many chatbots tend to agree with the user, even when the user is wrong. Settle disagreements with evidence, not with who pushed harder.`,{kind:"bot",device:"phone",ask:`What's ${v[0]} × ${v[1]}?`,reply:`${v[0]} × ${v[1]} = ${r}.`,more:[{u:`no it's ${w}`},{b:`You're absolutely right, I apologize for the mistake! ${v[0]} × ${v[1]} is ${w}.`}]}); },
  fair(){ const v=pick(["Should our school require uniforms?","Should school start later in the morning?","Should phones be banned during class?","Should our school switch to a four-day week?"]);
    const short=v.replace(/^Should (our )?school /i,"").replace("?","");
    return choiceItem("use:fair"+v,"Fair summary","This poster is up in the hallway, and you want to prepare.","You want a balanced overview of the debate. Which prompt is best?",[`Why is it bad that we ${short}?`,`Prove that it's good to ${short}.`,`Give me the strongest arguments on both sides of “${v}” and say which points are backed by research and which are opinion.`,`${short}?`],2,"A leading question gets a one-sided answer. Asking for both sides, and for evidence versus opinion, gets you something you can actually think with.",{kind:"poster",surface:pick(["wall","corkwall"]),eyebrow:"Student Council presents",title:"Debate Night",ask:v,body:"Both sides welcome. Bring evidence.",when:`${day()} · ${rint(5,7)} PM · Library`,f1:pick([["Robotics Club","Tuesdays 3:30 · Room 114"],["Chess Club","Mondays · Library"],["Art Show","Submissions due Friday"]]),f2:pick([["Lost","Blue water bottle with stickers. Ask the front office."],["Bake Sale","Friday at lunch · All proceeds to the band"],["Found","Calculator in Room 210. See Mr. Haddad."]])}); },
  thanks(){ const who=pick([["soccer coach","she stayed late to help me with penalty kicks"],["chemistry teacher","he explained stoichiometry three different ways until I got it"],["neighbor","she watered our plants for two weeks while we were away"],["bus driver","he waited for me when I was running late in the rain"]]);
    return choiceItem("use:thanks"+who[0],"Thank-you note",`You want to thank your ${who[0]}.`,"Which prompt will get the most useful draft?",["write thank you note","Write a thank-you note.",`Help me write a short, warm thank-you note to my ${who[0]}. Mention that ${who[1]}. Keep it under 80 words.`,"Thank you note, make it amazing"],2,"The best prompt says who it's for, a real detail to include, the tone and the length. Details you give are details the AI doesn't have to invent.",{kind:"bot",device:"laptop",place:nextPlace(),side:pick(SIDES)}); },
  friend(){ const v=pick([["a photo of their report card","can u help me figure out if i can still pull my gpa up"],["a screenshot of a private group chat","is this person being mean or am i overthinking"],["their college essay draft","be honest is it good"]]); const f=pick(FN);
    return choiceItem("use:friend"+v[0],"A friend's info",`${f} sent you ${v[0]}.`,"You want a chatbot's help with it. What's the right move?",["Upload it, it's no big deal","Ask your friend first, and leave out names and personal details","Post it so more people can help","Forward it to the group chat"],1,"It's your friend's private information. Ask before sharing it anywhere, including with an AI, and strip out names and details that aren't needed.",{kind:"chat",title:f,sub:"iMessage",time:clock(),msgs:[{time:"Today "+ampm(clock())},{who:f,t:`ok dont judge me 😭 [Attachment: ${v[0].replace(/^(a|their) /,"")}]`},{who:f,t:v[1]},{me:true,t:"yeah one sec"}]}); },
  feedback(){ return choiceItem("use:fb"+rint(1,999),"Too-good feedback","A student asked a chatbot to review an essay draft.","How could the student get more honest feedback?",["Ask again until it says something negative","Ask it to list the three weakest parts of the essay and how to fix each one","Tell it the essay is already perfect","Stop using feedback tools"],1,"Chatbots tend to be agreeable. Asking directly for weaknesses and fixes gets you feedback you can use.",{kind:"bot",device:pick(["phone","laptop"]),place:nextPlace(),ask:"Is my essay good? Be honest.",reply:pick(["Your essay is fantastic! It's well-written, engaging and shows great insight. You should be proud of this work!","Wow, this is an excellent essay! Your ideas are clear and compelling. Great job!"])}); },
  cite(){ const nm=pick(["M. Okafor","J. Lindqvist","R. Patel","S. Moreno"]); const yr=rint(2016,2023);
    return choiceItem("use:cite"+nm,"Cited source","HelperBot gave a student a source for a research paper.","What should the student do before citing it?",["Cite it, the chatbot found it","Open the source and check that it exists and says what the chatbot claims","Change a few words so it's original","Ask the chatbot if it's sure"],1,"Chatbots can invent sources or misdescribe real ones. Only cite something you've found and read yourself. Asking the chatbot if it's sure isn't a real check.",{kind:"bot",device:"laptop",place:nextPlace(),ask:`Find me a source about ${pick(["screen time and sleep","music and studying","exercise and grades"])}.`,reply:`Sure! A ${yr} article in the Journal of Youth Wellness by ${nm} found that teens who used phones within an hour of bed slept ${rint(30,60)} minutes less on average.`,side:pick(SIDES)}); },
  quote(){ const v=pick([["Abraham Lincoln","technology","“The future belongs to those who build tools to lift every voice.”","1862"],["Marie Curie","friendship","“A true friend is the first experiment worth repeating.”","1911"],["Benjamin Franklin","video games","“Play is the workshop where the mind learns patience.”","1771"]]);
    return choiceItem("use:quote"+v[0],"Famous quote","A student wants a quote for a speech.","What should the student do with this quote?",[`Use it, it sounds like ${v[0]}`,"Search for the exact quote in a reliable source before using it","Change the wording slightly",`Credit it to “a famous person”`],1,`Chatbots sometimes attribute made-up quotes to famous people. ${v[0]} talking about ${v[1]} is a red flag on its own. Search the exact wording in a trusted collection of the person's writings.`,{kind:"bot",device:"laptop",place:nextPlace(),ask:`Give me an inspiring quote from ${v[0]} about ${v[1]}.`,reply:`${v[2]} — ${v[0]}, ${v[3]}`,side:pick(SIDES)}); },
  plan(){ const subs=pickN(["algebra","chemistry","Spanish","history","biology","English"],3);
    return choiceItem("use:plan"+subs.join(),"Study plan","Finals are in two weeks.","Which prompt will give the most useful study plan?",["make me a study plan",`I have finals in 2 weeks in ${subs[0]}, ${subs[1]} and ${subs[2]}. I can study 90 minutes on weeknights. ${cap(subs[1])} is my weakest. Make a day-by-day plan.`,"Study plan for finals pls","What should I study?"],1,"The useful prompt gives subjects, time available, deadlines and your weak spot. The AI can only plan around what you tell it.",{kind:"bot",device:"phone",draft:"make me a study plan"}); },
  summary(){ const town=pick(TOWNS);

function tsys(tabs,o={}){
  return `<div class="tsys ${o.cls||""}"><div class="tstrip">${o.dots!==false?`<span class="dots"><i></i><i></i><i></i></span>`:""}${tabs.map((t,i)=>`<button class="ttab ${i===0?"on":""}" data-tab="${i}" ${t.hidden?"hidden":""}><i class="fav" style="background:${t.icon||"#999"}"></i><span>${esc(t.t)}</span></button>`).join("")}<span class="tplus">+</span></div>
  <div class="tpanes">${tabs.map((t,i)=>`<div class="tpane ${i===0?"on":""}" data-pane="${i}">${t.url!==undefined?`<div class="urlbar"><span class="navb">‹</span><span class="navb">›</span><span class="url">${esc(t.url)}</span></div>`:""}<div class="pg">${t.html}</div></div>`).join("")}</div></div>`;
}
function ptabs(tabs){
  return `<div class="tsys ptabs"><div class="tpanes">${tabs.map((t,i)=>`<div class="tpane ${i===0?"on":""}" data-pane="${i}">${t.html}</div>`).join("")}</div><div class="tstrip pstrip">${tabs.map((t,i)=>`<button class="ttab ${i===0?"on":""}" data-tab="${i}"><b>${t.g||"●"}</b><span>${esc(t.t)}</span></button>`).join("")}</div></div>`;

renderScene=function(item){

    const inner=tsys(tabs(sc.tabs,item));
    if(sc.device==="window") return {t:"browser",html:`<div class="win"><div class="win-in">${inner}</div></div>`};
    if(sc.device==="monitor") return {t:"scene",html:placeWrap(sc.place||"office",`<div class="mon2"><div class="lid"><div class="lscr">${inner}</div></div><div class="neck"></div><div class="foot"></div></div>`)};
    return {t:"scene",html:laptopIn(sc.place||"coffee",null,inner,{bez:sc.bez})};
  }
  if(sc.kind==="review2") return {t:"scene",html:laptopIn(sc.place||"coffee",sc.url||"brightcart.example/reviews",reviewPage2(sc))};
  if(sc.kind==="social2") return {t:"browser",html:`<div class="win"><div class="win-in">${chrome("loop.example/"+sc.handle)}<div class="pg">${socialPage2(sc)}</div></div></div>`};
  if(sc.kind==="news2"){ const s=sc.surface||"library"; const under=s==="library"?prop("shelf","left:-5%;top:0")+dev("stool","",{x:50,y:62}):""; return {t:"scene",html:surface(s,under+dev("news",newsPages(sc),{x:50,y:54,rot:-1.5,my:52}))}; }
  if(sc.kind==="phonetabs"){
    const body=t=>{

      if(t.type==="contacts") return `<div class="vm-h">Contacts</div><div class="ct">${t.rows.map(r=>`<button class="ct-row" data-toggle="c${r[0].replace(/\W/g,"")}"><b>${esc(r[0])}</b><span>${esc(r[2]||"")}</span></button><div class="ct-det" data-tgt="c${r[0].replace(/\W/g,"")}" hidden>mobile<br><b>${esc(r[1])}</b></div>`).join("")}</div>`;

  }

};

rane","What was the Silk Road?":"Silk Road","Why does the Moon shine?":"Moonlight","What is the Bill of Rights?":"Bill of Rights","What causes earthquakes?":"Earthquake","How do airplanes stay in the air?":"Lift (force)","What is inflation?":"Inflation","What's the chemical symbol for gold?":"Gold","How does the Electoral College work?":"Electoral College","How do bees make honey?":"Honey","Who wrote Frankenstein?":"Frankenstein","How fast does sound travel?":"Speed of sound","What happened at the Boston Tea Party?":"Boston Tea Party"};
const FILLER=t=>[`${t} has been studied and written about for a long time, and many textbooks include a section on it.`,`Teachers often use ${t} as an example when introducing related topics.`,`Some details about ${t} are commonly misunderstood, which is why primary sources and reference works are useful.`];
const REFS=t=>[`Encyclopedia of Science and History, “${t},” 2019 edition.`,`National education resource center, “${t}: an overview.”`,`University library guide to ${t}.`];
const BLOGS=["TruthNuggets","MindBlown Daily","FactBomb Zone","WowFacts 365"];
const HISTQ=["Can you explain what a metaphor is?","What's a good way to memorize vocab?","How do I write a thesis statement?","What's the difference between weather and climate?"];
const HISTA=["A metaphor compares two things by saying one is the other, like “time is a thief.”","Try spaced repetition: review the words a little every day instead of all at once.","A thesis statement is one or two sentences that state your main argument.","Weather is short-term; climate is the long-term average pattern."];

function linesL(L){
  let base, ref=null;
  const special=Math.random()<.28;
  if(!special||L==="easy"&&chance(.5)){
    const t=pick(FACTS); const w=pick(t.w); const ex=w.x||[];
    let trues=t.f.filter((_,i)=>!ex.includes(i)); const keep=Math.min(trues.length,L==="easy"?3:4);
    while(trues.length>keep) trues.splice(rint(0,trues.length-1),1);
    const pos=rint(0,trues.length); const lines=[...trues]; lines.splice(pos,0,w.s);
    const title=WIKI[t.q]||t.q.replace(/\?$/,"");
    base={sig:"fact:"+t.q+"|"+w.s.slice(0,30)+"|"+L,ask:t.q,c:pick(t.c),lines,wrong:pos,tag:w.t,explain:w.e,title};
    if(L!=="easy"){
      const correction=`A common mistake is the claim that ${w.s.charAt(0).toLowerCase()+w.s.slice(1).replace(/\.$/,"")}. In fact: ${w.e.replace(/^(That was|That's|It's the reverse:)\s*/,m=>m.startsWith("It")?"":"that was ")}`;
      const wiki={type:"wiki",title,lead:t.f[0],secs:L==="medium"?[{h:"Overview",p:t.f.slice(1)},{h:"Common misconceptions",p:[correction]}]:[{h:"Overview",p:[FILLER(title)[0],...t.f.slice(1,3)]},{h:"Details",p:[FILLER(title)[1],correction,...t.f.slice(3)]},{h:"In education",p:[FILLER(title)[2]]}],refs:REFS(title)};
      if(L==="medium") ref=[{t:title+" - OpenPedia",i:"wiki",url:"openpedia.example/wiki/"+title.replace(/ /g,"_"),body:wiki}];
      else { const blog=pick(BLOGS);
        ref=[{t:"Search: "+t.q.slice(0,22)+"…",i:"search",url:"findr.example/search",body:{type:"search",q:t.q,results:shuffle([{t:`${title} - OpenPedia`,u:"openpedia.example › wiki",s:`From OpenPedia, the free encyclopedia. This article is about ${title}. Sections: Etymology, Overview, History of study, Details…`,to:2},{t:`20 Facts Your Teacher Never Told You (#7 Will Shock You)`,u:`${blog.toLowerCase().replace(/ /g,"")}.example › facts`,s:`You won't believe what scientists found out about ${title.toLowerCase()}. Number 7 changes everything…`,to:3},{t:`Question about ${title.toLowerCase()} : AskAnything`,u:"askanything.example › q",s:`${rint(8,30)} answers · people disagree`,to:4}])}},
             {t:title+" - OpenPedia",i:"wiki",url:"openpedia.example/wiki/"+title.replace(/ /g,"_"),body:wiki},
             {t:"20 Facts Your Teacher…",i:"blog",url:blog.toLowerCase().replace(/ /g,"")+".example/facts",body:{type:"blog",site:blog,title:"20 Facts Your Teacher Never Told You",by:pick(FN)+" "+pick(LI)+".",paras:[`Fact #${rint(3,6)}: Did you know a group of flamingos is called a flamboyance? Pretty cool.`,`Fact #7: ${w.s} Most people have no idea!`,`Fact #${rint(8,12)}: Honey never spoils if it's stored properly.`,"Share this with someone who needs to know!"]}},
             {t:"AskAnything",i:"#F28C28",url:"askanything.example/q/"+rint(10000,99999),body:{type:"forum",title:`Can someone explain ${title.toLowerCase()}? Saw something on a blog`,posts:[[pick(FN).toLowerCase()+rint(1,99),rint(20,90),"Yes, I read it on a blog once."],[pick(FN).toLowerCase()+rint(1,99),rint(5,40),"I don't think so? Check an encyclopedia."],[pick(FN).toLowerCase()+rint(1,99),rint(1,12),"My uncle says it's true lol"]]}}];
        base.explain=w.e+" Notice how the search results disagree: a viral blog repeats the claim, but the encyclopedia, which cites references, gives the real fact. Popular doesn't mean correct.";
      }
      if(L==="medium") base.explain=w.e+" The OpenPedia tab already had the correct fact. Checking a second, reliable source is the fastest way to catch a chatbot mistake.";
    }
  } else {
    const kind = L==="easy"?pick(["letters","math","live"]):L==="medium"?pick(["math","live","source"]):pick(["source","live","math"]);
    if(kind==="letters") base=factLetters();
    if(kind==="math"){ base=factMath(); if(L!=="easy"){ ref=[{t:"Calculator",i:"calc",url:"calc.example",body:{type:"calc"}}]; base.explain+=" The Calculator tab works, so you could have checked it right there."; } }
    if(kind==="live"){ base=factLive(); if(L!=="easy"){ const city=base.ask.match(/in (\w+)/)?.[1]||"the city"; ref=[{t:`${city} weather - SkyCast`,i:"weather",url:"skycast.example/"+city.toLowerCase(),body:{type:"weather",city,temp:rint(41,52),cond:pick(["Light rain","Overcast, drizzle","Thunderstorms"]),hi:rint(53,58),lo:rint(38,44)}}]; base.explain+=" The SkyCast tab shows the real, live conditions, and they don't match what HelperBot said."; } }
    if(kind==="source"){ base=factSource(); const jr=base.lines[base.wrong].match(/in (the [A-Z][^,]+?|[A-Z][^,]+?) found/)?.[1]||"the journal";
      if(L!=="easy"){ ref=[{t:"Search: "+jr.slice(0,22)+"…",i:"search",url:"findr.example/search",body:{type:"search",q:`"${jr}"`,meta:"About 0 results",note:`No results found for “${jr}”. Did you mean: Journal of Adolescent Health?`,results:[{t:"Journal of Adolescent Health - Official site",u:"jahonline.example",s:"A peer-reviewed journal covering research on the health of young people."},{t:"How to spot a fake citation",u:"library.example › guides",s:"If a journal or article doesn't turn up in a search, it may not exist."}]}}]; base.explain+=" Searching the journal's name in the other tab turns up nothing at all, which is a strong sign the citation was invented."; } }
  }
  const dev=ref?"laptop":(chance(.5)?"phone":"laptop");
  const before=L==="hard"?[0,1,2].map(()=>{ const i=rint(0,3); return [{u:HISTQ[i]},{b:HISTA[i]}]; }).flat():(chance(.3)?[{u:pick(["hi","quick question","can you help me with homework"])},{b:pick(["Of course! What do you need?","Sure, what's up?","Happy to help. What are you working on?"])}]:[]);
  const bot={type:"bot",ask:base.ask,before,intro:pick(INTROS),outro:pick(OUTROS),side:pick(SIDES)};
  const scene=ref?{kind:"web",place:nextPlace(),tabs:[{t:"HelperBot",i:"bot",url:"helperbot.example/chat",body:bot},...ref]}:{kind:"bot",device:dev,place:dev==="laptop"?nextPlace():undefined,...bot,time:pick(["4:12","7:30","9:48","11:06"])};
  return {sig:base.sig+"|"+L,kind:"lines",level:L,interactive:!!ref||L==="hard",label:ref?"Chat log + sources":"Chat log",context:base.c,ask:base.ask,lines:base.lines,wrong:base.wrong,tag:base.tag,explain:base.explain,scene};
}

linesL=function(L){

  }

    it.scene.tabs.forEach(t=>{

        const facts=FACTS.find(f=>(WIKI[f.q]||"")===b.title);

        const core=[...all.slice(1),corr].filter(Boolean);

        else b.secs=[{h:"Overview",p:core.slice(0,2)},secs[1],{h:"Details",p:core.slice(2).length?core.slice(2):[FILLER(b.title)[1]]},secs[2]];
        b.refs=[...REFS(b.title),`Smith, J. (2018). “${b.title}: a review.” Journal of General Science, 12(4).`];
      }
      if(b.type==="search"&&b.results&&b.results.length>=3){
        b.results.push({t:`${b.q.replace(/\?$/,"")} - Quizlet-style flashcards`,u:"studycards.example › sets",s:"Flashcards made by users. Not reviewed for accuracy."},{t:`Kids' Corner: fun facts`,u:"funlearn.example › kids",s:"Bright pictures and short facts for younger readers."});

    });
  }
  return it;
};

HARD.detectorHistory=()=>{
  const isAI=chance(.45); const name=person(); const t=isAI?pick(["In my opinion, the most important quality in a friend is honesty. A true friend tells you the truth even when it is difficult, which builds trust and strengthens the foundation of every meaningful relationship. Ultimately, honesty allows friendships to grow and thrive over time.","Learning a new skill requires patience, dedication and perseverance. By embracing challenges and remaining committed to growth, individuals can unlock their full potential and achieve remarkable success in every area of life."]):pick(DETECT.filter(x=>!/In my opinion/.test(x))).replace(/\{n\}/g,pick(FN));
  const words=t.split(/\s+/).length; const days=dayList(3); const fp=rint(1,3); const score=rint(90,99);
  const hist=isAI?[[`${days[0]}, 6:10 PM`,`${name} · document created`],[`${days[0]}, 6:11 PM`,`${name} · title changed`],[`${days[2]}, 11:51 PM`,`${name} · +${words} words`],[`${days[2]}, 11:52 PM`,`${name} · formatting`]]
    :[[`${days[0]}, 7:10 PM`,`${name} · document created`],[`${days[0]}, 7:31 PM`,`${name} · +${Math.round(words*.4)} words, −4`],[`${days[1]}, 4:45 PM`,`${name} · +${Math.round(words*.35)} words`],[`${days[1]}, 4:58 PM`,`${name} · formatting`],[`${days[2]}, 8:02 PM`,`${name} · +${words-Math.round(words*.4)-Math.round(words*.35)+6} words, −2`],[`${days[2]}, 8:10 PM`,`${name} · spelling fixes`]];
  return ai({sig:"hard:dh"+t.slice(0,30)+isAI,level:"hard",interactive:true,kind:"choice",label:"AI detector result",context:`${name}'s teacher ran this paragraph through a free AI detector and shared everything she has.`,
    scene:{kind:"web",place:nextPlace(),tabs:[{t:"AIScan Pro",i:"det",url:"aiscanpro.example/check",body:{type:"detector",text:t,score}},{t:"Accuracy - AIScan Pro",i:"det",url:"aiscanpro.example/accuracy",body:{type:"detabout",fp}},{t:"Personal essay - Docs",i:"docs",url:"docs.example/d/"+rint(10000,99999),body:{type:"docs",file:"Personal essay.doc",name,cls:"English",title:"Personal Essay",paras:[t],hist}}]}},
    "Was this paragraph written with AI?",isAI,
    isAI?`AI. The detector score alone proves nothing, but the version history does: the whole ${words}-word paragraph appeared in one jump just before midnight, and the writing is generic filler with no personal details.`:`Not AI. The detector says ${score}%, but its own accuracy page admits it flags about ${fp} in 10 human essays. The version history shows the paragraph being typed in pieces over several days, and it's full of personal details.`);
};

HARD.phishInbox=()=>{
  const school=pick(TOWNS)+" High"; const dom=school.toLowerCase().replace(/ /g,"")+".example"; const fakeDom=dom.replace(/l/,"1").replace(/o/,"0"); const t=teacher();
  const ln=t.split(" ").pop().toLowerCase();
  const scam={from:`${school} IT Help Desk`,shown:`helpdesk@${dom}`,real:`helpdesk@${fakeDom}`,reply:`support-team@${fakeDom}`,extra:"via bulk-mailer.example",subject:pick(["ACTION REQUIRED: Your password expires today","Unusual sign-in to your school account","Your grades portal access will be suspended"]),time:"6:02 AM",body:"Your school password expires in 2 hours. To avoid losing access to your email and grades, confirm your current password using the secure link below. Failure to act will result in account suspension.",btn:"Confirm password"};
  const legitIT={from:`${school} IT Help Desk`,shown:`helpdesk@${dom}`,real:`helpdesk@${dom}`,subject:"Scheduled maintenance this Saturday",time:"7:30 AM",body:"The student portal will be down for maintenance Saturday from 6 to 9 AM. You don't need to do anything. Questions? Visit the help desk in Room 112."};
  const filler=[{from:t,shown:`${ln}@${dom}`,real:`${ln}@${dom}`,subject:"Reminder: lab report due Friday",time:"8:14 AM",body:`Hi all, quick reminder that the lab report is due Friday. Bring your data tables Thursday if you want feedback. — ${t}`},{from:"Library",shown:`library@${dom}`,real:`library@${dom}`,subject:"Your hold is ready",time:"Yesterday",body:"The book you requested is ready at the front desk. It will be held for 7 days."},{from:"Student Council",shown:`council@${dom}`,real:`council@${dom}`,subject:"Homecoming volunteer sign-ups",time:"Yesterday",body:"We need volunteers for decorations and the bake sale table. Sign up in the main office by Wednesday."},{from:"Athletics",shown:`athletics@${dom}`,real:`athletics@${dom}`,subject:"Game moved to Thursday",time:"Mon",body:"Thursday's game starts at 5:30 instead of 6. Buses leave at 4:15 from the gym lot."},{from:"Counseling Office",shown:`counseling@${dom}`,real:`counseling@${dom}`,subject:"College fair next week",time:"Mon",body:"Over 40 colleges will visit the gym next Tuesday. Bring questions!"}];
  const targetScam=chance(.55);
  const mails=shuffle([targetScam?scam:legitIT,...pickN(filler,4),...(targetScam?[]:[chance(.5)?scam:pick(filler)])]).filter((m,i,a)=>a.indexOf(m)===i);
  return yn({sig:"hard:ph"+school+targetScam,level:"hard",interactive:true,kind:"choice",label:"Inbox",context:`Your school inbox at ${school}. The IT Help Desk email is the one you need to decide about.`,scene:{kind:"web",place:nextPlace(),tabs:[{t:"Inbox - Mail",i:"mail",url:"mail."+dom+"/inbox",body:{type:"inbox",mails}}]}},

const BLOAT_TABS=[{t:"Homework - Docs",i:"docs",url:"docs.example/d/hw",body:{type:"article",outlet:"Docs",section:"Homework",headline:"Homework list",paras:["Math: page 214, problems 1–19 odd. Show work!","English: read chapter 6 and write a short reflection (half a page).","Bio: finish the cell diagram, label all 8 parts.","History: notes on section 4.2, quiz Thursday.","Spanish: vocab list 7, practice on the app.","Bring permission slip for the field trip.","Return library book by Friday.","Ask Mr. Sato about the extra-credit worksheet."]}},{t:"Class page",i:"#13724A",url:"class.example/announcements",body:{type:"article",outlet:"Class page",section:"Announcements",headline:"This week",paras:["Quiz on Thursday covers chapters 3 and 4. Study the review sheet.","Office hours moved to Wednesday after school this week only.","Don't forget your lab notebooks. We start the new lab Monday.","Late work policy: 10% off per day, up to 3 days.","Field trip permission slips are due next Tuesday.","Extra help sessions: Tuesdays and Thursdays in Room 214.","Reminder: phones go in the caddy during tests."]}},{t:"Playlist - Tunes",i:"#C8361D",url:"tunes.example/study-mix",body:{type:"article",outlet:"Tunes",section:"Playlist",headline:"Study mix · 42 songs",paras:["1. Rainy Morning · 3:14","2. Focus Flow · 4:02","3. Quiet Library · 2:58","4. Late Night Lo-fi · 3:41","5. Window Seat · 2:47","6. Coffee Steam · 3:20","7. Night Bus · 4:11","8. Notebook Margins · 2:39","9. Slow Sunday · 3:55","10. Paper Planes · 3:02"]}}];
function linesT(L){
  const t=pick(FACTS.filter(f=>WIKI[f.q])); const title=WIKI[t.q]; const w=pick(t.w); const ex=w.x||[];
  let trues=t.f.filter((_,i)=>!ex.includes(i)); const keep=Math.min(trues.length,L==="easy"?3:4);
  while(trues.length>keep) trues.splice(rint(0,trues.length-1),1);
  const modes=L==="easy"?["good","good","none","contra","contra"]:L==="medium"?["good","good","none","contra","contra","dead"]:["good","good","none","contra","contra","dead","blog"];
  const mode=pick(modes);
  const hasWrong=mode==="contra"||mode==="blog"||mode==="dead"||(mode==="none"&&chance(.5));
  const lines=[...trues]; let pos=-1; if(hasWrong){ pos=rint(0,lines.length); lines.splice(pos,0,w.s); }
  const corr=stripMeta(w.e)||w.e;
  const extras=L==="easy"?[]:pickN(BLOAT_TABS,L==="hard"?2:1);
  const srcIdx=1+extras.length;
  const tabsArr=[{t:"HelperBot",i:"bot",url:"helperbot.example/chat",body:{type:"bot",ask:t.q,intro:pick(INTROS),outro:"",side:pick(SIDES),before:L==="hard"?[{u:pick(HISTQ)},{b:pick(HISTA)}]:[]}},...extras];
  let srcLabel=null;
  if(mode==="good"||mode==="contra"){
    const facts=[...trues,...(mode==="contra"?[corr]:[])];
    const secs=L==="easy"?[{h:"Overview",p:facts}]:[FILL_SECS(title)[0],{h:"Overview",p:[FILLER(title)[0],...facts.slice(0,2)]},FILL_SECS(title)[1],{h:"Details",p:[FILLER(title)[1],...facts.slice(2)]},...(L==="hard"?[FILL_SECS(title)[2],FILL_SECS(title)[3]]:[])];
    srcLabel=`${title} - OpenPedia`;
    tabsArr.push({t:srcLabel,i:"wiki",url:"openpedia.example/wiki/"+title.replace(/ /g,"_"),hidden:true,body:{type:"wiki",title,lead:FILLER(title)[2],secs,refs:REFS(title),L}});
  } else if(mode==="dead"){
    srcLabel=`“${title}: Key Facts” - Journal of Student Science`;
    tabsArr.push({t:"Page not found",i:"#999",url:"journalofstudentscience.example/articles/"+title.toLowerCase().replace(/\W+/g,"-"),hidden:true,body:{type:"article",outlet:"Journal of Student Science",section:"Error 404",headline:"Page not found",paras:["The page you're looking for doesn't exist or may have been moved.","Try searching our archive or return to the homepage."]}});
  } else if(mode==="blog"){
    const blog=pick(BLOGS); srcLabel=`20 Facts About ${title} - ${blog}`;
    tabsArr.push({t:srcLabel,i:"blog",url:blog.toLowerCase().replace(/ /g,"")+".example/facts",hidden:true,body:{type:"blog",site:blog,title:`20 Facts About ${title} You Won't Believe`,by:pick(FN)+" "+pick(LI)+".",paras:[`Fact #${rint(2,5)}: Did you know a group of flamingos is called a flamboyance?`,`Fact #7: ${w.s} Most people have no idea!`,`Fact #${rint(8,12)}: Honey never spoils if stored properly.`,"Share this with someone who needs to know!"],L}});
  }
  if(srcLabel) tabsArr[0].body.src={t:srcLabel,tab:srcIdx};
  const trusted=mode==="good";
  const wrongNote=hasWrong?` Sentence ${pos+1} is wrong: ${corr}`:"";
  const exp={good:"Yes. HelperBot linked a reliable encyclopedia article, and when you open it, it backs up every numbered claim. Always open the source and read it before you trust it.",
    none:"No. HelperBot gave no source at all, so you have no way to check its claims. Treat unsourced chatbot answers as unverified until you confirm them somewhere reliable."+wrongNote,
    contra:`No. HelperBot cited a source, but when you open it, the source contradicts the answer.${wrongNote} Having a link isn't enough; you have to read what it says.`,
    dead:"No. The source link leads to a page that doesn't exist. Chatbots sometimes invent citations that look real."+wrongNote,
    blog:`No. The only source is a viral blog with no author credentials and no citations. It repeats the claim, but repetition isn't evidence.${wrongNote}`}[mode];
  return yn({sig:"trust:"+t.q+mode+pos+L,kind:"lines",level:L,interactive:!!srcLabel||extras.length>0,label:"Chat answer",context:pick(t.c),ask:t.q,lines,wrong:pos,tag:mode,
    scene:{kind:"web",place:nextPlace(),tabs:tabsArr}},"Is HelperBot's answer trustworthy?",trusted,exp);
}
linesL=function(L){ if(L!=="easy"&&chance(.2)) return factDeck(L); return linesT(L); };

NFACT.mathSteps={L:"easy",f(){
  const ok=chance(.5); const kind=pick(["eq","pct","eq"]); let ask,steps,wrongNote="";
  if(kind==="eq"){ const a=rint(2,9),x=rint(3,15),b=rint(3,40),c=a*x+b; let s1=c-b, x1=x; const where=pick(["sub","div"]);
    if(!ok){ if(where==="sub"){ s1=c-b+pick([-10,10]); x1=s1/a; wrongNote=`${c} − ${b} is ${c-b}, not ${s1}`; } else { x1=x+pick([-1,1]); wrongNote=`${c-b} ÷ ${a} is ${x}, not ${x1}`; } }
    const x1s=Number.isInteger(x1)?x1:x1.toFixed(2);
    ask=`Solve ${a}x + ${b} = ${c}. Show the steps.`;
    steps=[`Subtract ${b} from both sides: ${a}x = ${c} − ${b} = ${s1}`,`Divide both sides by ${a}: x = ${s1} ÷ ${a} = ${x1s}`,`So x = ${x1s}.`]; }
  else { const p=pick([15,20,25,12,35]), n=pick([240,80,160,60,420,360]); const r=p*n/100; let r1=r; if(!ok){ r1=r+pick([-4,-2,2,6]); wrongNote=`${(p/100).toFixed(2)} × ${n} is ${r}, not ${r1}`; }
    ask=`What is ${p}% of ${n}? Show the steps.`; steps=[`Change ${p}% to a decimal: ${p} ÷ 100 = ${(p/100).toFixed(2)}`,`Multiply: ${(p/100).toFixed(2)} × ${n} = ${r1}`,`So ${p}% of ${n} is ${r1}.`]; }
  const reply=`<p>Sure! Here's how to solve it step by step:</p><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p>Great job working through this!</p>`;
  return yn({sig:"f7:"+ask+ok,level:"easy",interactive:true,kind:"choice",label:"Math help",context:"A student is checking homework with HelperBot. A calculator is open in the other tab.",scene:webSc([botTab(ask,reply),{t:"Calculator",i:"calc",url:"calc.example",body:{type:"calc"}}])},
    FQ,ok,ok?"Yes. Every step checks out. You can confirm each one with the calculator.":`No. There's an arithmetic slip: ${wrongNote}. Chatbots predict text, so they can make math mistakes that look confident. The calculator tab catches it.`);
}};

const labOf=item=>{ const d=LAB_DEFS[item.lab||"wolf"]; const sc=item.scene&&item.scene.pool?item.scene:{...d.build()}; return {d,pool:sc.pool,tests:sc.tests}; };
function renderLab(item){
  const {d,pool}=labOf(item);
  return {t:"scene",html:surface("lab",dev("lt",`<div class="lt-label"><span>${esc(d.tray[0])}</span><span>${esc(d.tray[1])}</span></div>${pool.map((p,i)=>d.card(p,{btn:true,sel:S.train.sel.includes(p.id),rot:PROT[i%PROT.length]})).join("")}`,{x:50,y:50}))};
}
function runLab(item,sel){
  const {d,pool,tests}=labOf(item); const [A,B]=d.cls; const set=pool.filter(p=>sel.includes(p.id));
  const va=[...new Set(set.filter(p=>p.y===A).map(p=>p.f))], vb=[...new Set(set.filter(p=>p.y===B).map(p=>p.f))];
  const rule=va.length===1&&vb.length===1&&va[0]!==vb[0]; const guess=t=>rule?(t.f===va[0]?A:B):t.y;
  const results=tests.map(t=>({t,guess:guess(t),ok:guess(t)===t.y}));
  return {bgRule:rule,map:rule?{[A]:va[0],[B]:vb[0]}:null,results,correct:results.filter(r=>r.ok).length,n:tests.length};
}

  const moto=(x,y,box)=>`<rect x="${x+14}" y="${y+10}" width="8" height="38" rx="3" fill="#222"/><circle cx="${x+18}" cy="${y+12}" r="5" fill="#444"/><circle cx="${x+18}" cy="${y+46}" r="5" fill="#444"/><rect x="${x+9}" y="${y+18}" width="18" height="3" fill="#888"/>${box?`<rect x="${x}" y="${y+2}" width="36" height="54" fill="none" stroke="#22C55E" stroke-width="2.4"/>`:""}`;
  return `<svg viewBox="0 0 400 230" role="img" aria-label="Parking lot camera view"><rect width="400" height="230" fill="#5E6266"/>${spots.map(s=>`<rect x="${s.x}" y="${s.y}" width="36" height="58" fill="none" stroke="#E8E8E8" stroke-width="1.5"/>`).join("")}${o.blind?`<rect x="294" y="0" width="106" height="230" fill="rgba(0,0,0,.55)"/><text x="347" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">OUTSIDE</text><text x="347" y="134" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">CAMERA VIEW</text>`:""}${veh.map(v=>v.t==="m"?moto(spots[v.i].x,spots[v.i].y,v.box):car(spots[v.i].x,spots[v.i].y,v.c,v.box)).join("")}<text x="8" y="224" font-family="monospace" font-size="10" fill="#fff">CAM 1 · LOT B · LIVE</text></svg>`;
}

/* ---------- U7 debate practice ---------- */
NUSE.debatePractice={L:"easy",f(){
  const good=chance(.5); const CTR={"later school start times":["Buses and parents' work schedules are built around the current start time.","Practices and after-school jobs would end later in the evening.","Students might just stay up later instead of sleeping more."],"banning phones during class":["Students may need to reach family in an emergency.","Phones can be useful tools for research and quick calculations.","Teaching responsible use might work better than a ban."],"a four-day school week":["Families would need child care on the fifth day.","Longer school days could leave students more tired.","Some students rely on school meals five days a week."],"year-round school":["Summer jobs and camps help students earn money and build skills.","Cooling older buildings all summer is expensive.","Families with kids at different schools would juggle different calendars."],"school uniforms":["Uniforms limit how students express themselves.","They can cost families extra money.","The evidence that uniforms improve behavior is mixed."],"longer lunch breaks":["The school day would have to end later.","Less class time could mean covering less material.","More unstructured time can lead to more conflicts."],"no homework on weekends":["Some classes need regular practice to keep up.","Weekends give students time for bigger projects.","Teachers might have to cut material from the course."],"letting students grade teachers":["Students might grade based on popularity instead of teaching.","Teachers might make classes easier to get better scores.","Students may not know what effective teaching looks like."]};
  const topic=pick(Object.keys(CTR));
  const ask=good?`I'm arguing FOR ${topic} in a class debate tomorrow. Argue the other side so I can practice my rebuttals. Keep each point short.`:`Write my rebuttal speech for the debate tomorrow. I'm arguing FOR ${topic}. I'm going to read it word for word.`;
  const reply=good?`Sure! Here are three arguments against ${topic}:\n${CTR[topic].map((x,i)=>(i+1)+". "+x).join("\n")}\nTry rebutting #1 first. What would you say?`:`Ladies and gentlemen, esteemed judges and worthy opponents: today I stand firmly in support of ${topic}. The evidence is overwhelming, and the benefits are undeniable…`;
  return yn({sig:"u7:"+topic+good+day(),level:"easy",interactive:false,kind:"choice",label:"Debate prep",context:"A student is preparing for a class debate.",scene:phoneBotSc(ask,reply)},
    "Is this a good way to use AI to prepare for the debate?",good,
    good?"Yes. Having AI argue the other side lets the student practice thinking on their feet. The rebuttals are still theirs.":"No. Reading a speech AI wrote word for word skips the whole point of a debate: thinking through the arguments yourself. And it won't help when the other side says something unexpected.");
}};

const SU_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`;
function updScroll(){ document.querySelectorAll("#stage [data-scrollend]").forEach(el=>{ const host=el.parentNode; let su=[...host.children].find(c=>c.classList.contains("su")); if(!su){ su=document.createElement("button"); su.type="button"; su.className="su"; su.setAttribute("aria-label","Scroll up to earlier messages"); su.innerHTML=SU_ICON; host.insertBefore(su,el); }
  su.style.top=(el.offsetTop+8)+"px"; const need=el.scrollHeight>el.clientHeight+12; const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<14; su.classList.toggle("show",need&&atBottom); }); }
document.addEventListener("scroll",e=>{ const t=e.target; if(t&&t.matches&&t.matches("#stage [data-scrollend]")) updScroll(); },true);
function mountStage(){ renderNotes(); applyReveal(); document.querySelectorAll("#stage [data-scrollend]").forEach(el=>{ el.scrollTop=el.scrollHeight; }); updScroll(); const st=document.getElementById("stage"); if(ro) ro.disconnect(); ro=new ResizeObserver(()=>sizeInk()); ro.observe(st); sizeInk(); }
function persistMarks(){ const item=curItem(); if(!item||item.kind==="train") return; const r=document.querySelector("#stage .sroot"); if(!r) return;
  r.querySelectorAll(".sent").forEach(el=>el.classList.remove("flag","miss")); S.marks[curKey()]={cls:[...r.classList].filter(c=>c!=="sroot").join(" "),html:r.innerHTML}; applyReveal(); save(); }

/* ---------- highlighter ---------- */
const seltool=document.getElementById("seltool"); let selRange=null,markTarget=null;
function hideSelTool(){ seltool.hidden=true; selRange=null; markTarget=null; }
const sceneEl=()=>document.querySelector("#stage .sroot");
function placeTool(rect){ seltool.hidden=false; const w=seltool.offsetWidth,h=seltool.offsetHeight; let x=rect.left+rect.width/2-w/2,y=rect.top-h-10; if(y<70) y=rect.bottom+10; x=Math.max(8,Math.min(x,window.innerWidth-w-8)); seltool.style.left=x+"px"; seltool.style.top=y+"px"; }
function showSelTool(range){ selRange=range.cloneRange(); markTarget=null; const inMark=[...sceneEl().querySelectorAll("mark.hl")].some(m=>range.intersectsNode(m));
  seltool.innerHTML=`<button class="sw y" data-hl="y" aria-label="Yellow highlight"></button><button class="sw p" data-hl="p" aria-label="Pink highlight"></button><button class="sw b" data-hl="b" aria-label="Blue highlight"></button><button data-hl="note">+ Note</button>${inMark?`<button data-hl="erase">Erase</button>`:""}`; placeTool(range.getBoundingClientRect()); }
function showMarkTool(m){ selRange=null; markTarget=m; seltool.innerHTML=`<button data-hl="remove">Remove highlight</button><button data-hl="note">+ Note</button>`; placeTool(m.getBoundingClientRect()); }
let selTimer=null;
document.addEventListener("selectionchange",()=>{ clearTimeout(selTimer); selTimer=setTimeout(()=>{ if(S.screen!=="play"||S.pen) return; const sel=getSelection(),sc=sceneEl(); if(!sc||!sel.rangeCount||sel.isCollapsed){ if(!markTarget) seltool.hidden=true; return; } const r=sel.getRangeAt(0); if(!sc.contains(r.commonAncestorContainer)||!r.toString().trim()) return; showSelTool(r); },180); });
function textNodesIn(range){ const root=range.commonAncestorContainer.nodeType===3?range.commonAncestorContainer.parentNode:range.commonAncestorContainer; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),out=[]; while(w.nextNode()){ const n=w.currentNode; if(range.intersectsNode(n)&&n.textContent.trim()&&!n.parentNode.closest("svg,.n")) out.push(n); } return out; }
function highlight(range,c){ textNodesIn(range).forEach(n=>{ let s=n===range.startContainer?range.startOffset:0,e=n===range.endContainer?range.endOffset:n.length; if(s>=e) return; let mid=n; if(s>0) mid=n.splitText(s); if(e-s<mid.length) mid.splitText(e-s); const pm=mid.parentNode.closest("mark.hl"); if(pm){ pm.className="hl hl-"+c; return; } const m=document.createElement("mark"); m.className="hl hl-"+c; mid.parentNode.insertBefore(m,mid); m.appendChild(mid); }); }
function unwrap(m){ const p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild,m); p.removeChild(m); p.normalize(); }
seltool.addEventListener("pointerdown",e=>e.preventDefault());
seltool.addEventListener("click",e=>{ const b=e.target.closest("[data-hl]"); if(!b) return; const a=b.dataset.hl;
  if(a==="note"){ const rect=selRange?selRange.getBoundingClientRect():markTarget.getBoundingClientRect(); const quote=(selRange?selRange.toString():markTarget.textContent).trim().slice(0,80); addNote(rect,quote?`“${quote}” `:""); }
  else if(a==="remove"&&markTarget){ unwrap(markTarget); persistMarks(); }
  else if(a==="erase"&&selRange){ [...sceneEl().querySelectorAll("mark.hl")].filter(m=>selRange.intersectsNode(m)).forEach(unwrap); persistMarks(); }
  else if(selRange){ highlight(selRange,a); persistMarks(); }
  getSelection().removeAllRanges(); hideSelTool(); });
document.addEventListener("scroll",()=>{ if(!seltool.hidden) hideSelTool(); },{passive:true});

/* ---------- sticky notes ---------- */
let noteSeq=Date.now();
function renderNotes(){ const layer=document.getElementById("notes"); if(!layer) return; layer.innerHTML=(S.notes[curKey()]||[]).map(n=>`<div class="sticky c-${n.c}" style="left:${n.x}%;top:${n.y}%" data-nid="${n.id}"><div class="grip"><span>Note · drag</span><button data-nact="color" aria-label="Change color">●</button><button data-nact="del" aria-label="Delete note">×</button></div><textarea data-ntext="${n.id}" placeholder="Write a note…" aria-label="Sticky note">${esc(n.t)}</textarea></div>`).join(""); }
function addNote(rect,text=""){ const st=document.getElementById("stage").getBoundingClientRect(); let x=50,y=40;
  if(rect){ x=((rect.right-st.left)/st.width)*100+1; y=((rect.top-st.top)/st.height)*100-4; } else { const n=(S.notes[curKey()]||[]).length; x=4+(n*7)%60; y=6+(n*9)%50; }
  x=Math.max(0,Math.min(x,76)); y=Math.max(0,Math.min(y,74)); const list=S.notes[curKey()]||(S.notes[curKey()]=[]); const id="n"+(noteSeq++);
  list.push({id,x,y,t:text,c:["y","p","b","g"][list.length%4]}); renderNotes(); save(); const ta=document.querySelector(`[data-ntext="${id}"]`); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } }
const findNote=id=>(S.notes[curKey()]||[]).find(n=>n.id===id);
app.addEventListener("click",e=>{ const b=e.target.closest("[data-nact]"); if(!b) return; const el=b.closest(".sticky"),id=el.dataset.nid,k=curKey();
  if(b.dataset.nact==="del"){ S.notes[k]=(S.notes[k]||[]).filter(n=>n.id!==id); renderNotes(); save(); } else { const n=findNote(id),cs=["y","p","b","g"]; n.c=cs[(cs.indexOf(n.c)+1)%4]; el.className="sticky c-"+n.c; save(); } });
let drag=null;
app.addEventListener("pointerdown",e=>{ const g=e.target.closest(".grip"); if(!g||e.target.closest("button")) return; const el=g.closest(".sticky"),st=document.getElementById("stage").getBoundingClientRect(),r=el.getBoundingClientRect(); drag={el,id:el.dataset.nid,dx:e.clientX-r.left,dy:e.clientY-r.top,st,w:r.width,h:r.height}; g.setPointerCapture(e.pointerId); e.preventDefault(); });
app.addEventListener("pointermove",e=>{ if(!drag) return; const {st,dx,dy,w,h,el}=drag; const x=Math.max(0,Math.min(e.clientX-st.left-dx,st.width-w)),y=Math.max(0,Math.min(e.clientY-st.top-dy,st.height-Math.min(h,st.height))); el.style.left=(x/st.width*100)+"%"; el.style.top=(y/st.height*100)+"%"; });
const endDrag=()=>{ if(!drag) return; const n=findNote(drag.id); if(n){ n.x=parseFloat(drag.el.style.left); n.y=parseFloat(drag.el.style.top); save(); } drag=null; };
app.addEventListener("pointerup",endDrag); app.addEventListener("pointercancel",endDrag);

/* ---------- pen ---------- */
let stroke=null;
function sizeInk(){ const c=document.getElementById("ink"); if(!c) return; const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1; c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); drawInk(); }
function drawInk(){ const c=document.getElementById("ink"); if(!c) return; const g=c.getContext("2d"); g.clearRect(0,0,c.width,c.height); g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="rgba(214,32,60,.88)"; g.lineWidth=Math.max(3,c.width*.0045);
  (S.ink[curKey()]||[]).concat(stroke?[stroke]:[]).forEach(s=>{ if(s.length<2) return; g.beginPath(); g.moveTo(s[0][0]*c.width,s[0][1]*c.height); for(let i=1;i<s.length;i++) g.lineTo(s[i][0]*c.width,s[i][1]*c.height); g.stroke(); }); }
const inkPt=e=>{ const r=e.target.getBoundingClientRect(); return [+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.height).toFixed(4)]; };
app.addEventListener("pointerdown",e=>{ if(e.target.id!=="ink"||!S.pen) return; stroke=[inkPt(e)]; e.target.setPointerCapture(e.pointerId); e.preventDefault(); });
app.addEventListener("pointermove",e=>{ if(!stroke||e.target.id!=="ink") return; stroke.push(inkPt(e)); drawInk(); });
const endStroke=()=>{ if(!stroke) return; if(stroke.length>1){ (S.ink[curKey()]||(S.ink[curKey()]=[])).push(stroke); save(); } stroke=null; drawInk(); };
app.addEventListener("pointerup",endStroke); app.addEventListener("pointercancel",endStroke);

/* ---------- exhibit interactions ---------- */
function switchTab(sys,i){ sys.querySelectorAll("[data-pane]").forEach(p=>{ if(p.closest(".tsys")===sys) p.classList.toggle("on",p.dataset.pane===i); }); sys.querySelectorAll("[data-tab]").forEach(b=>{ if(b.closest(".tsys")===sys&&b.classList.contains("ttab")) b.classList.toggle("on",b.dataset.tab===i); }); const pane=sys.querySelector(`[data-pane="${i}"]`); if(pane) pane.querySelectorAll("[data-scrollend]").forEach(el=>el.scrollTop=el.scrollHeight); updScroll(); }
function calcEval(s){ s=String(s).replace(/×/g,"*").replace(/÷/g,"/").replace(/,/g,""); if(!/^[0-9+\-*/().\s]+$/.test(s)) return "Use numbers and + − × ÷"; try{ const v=Function("return ("+s+")")(); return Number.isFinite(v)?String(Math.round(v*1e6)/1e6):"Error"; }catch(e){ return "Error"; } }
app.addEventListener("click",e=>{
  const st=e.target.closest("#stage"); if(!st||S.pen) return;
  const su=e.target.closest(".su"); if(su){ const el=su.nextElementSibling; if(el) el.scrollBy({top:-el.clientHeight*.85,behavior:"smooth"}); return; }
  const o=e.target.closest("[data-open]"); if(o){ let sys=o.closest(".tsys"), btn=null; const find=s=>[...s.querySelectorAll(`[data-tab="${o.dataset.open}"]`)].find(b=>b.classList.contains("ttab")&&b.closest(".tsys")===s&&b.parentElement.matches(".tstrip:not(.dk-thumbs):not(.qz-tabs):not(.ib-list)")); while(sys&&!(btn=find(sys))) sys=sys.parentElement&&sys.parentElement.closest(".tsys"); if(btn){ btn.hidden=false; switchTab(sys,o.dataset.open); persistMarks(); } return; }
  const t=e.target.closest("[data-tab]"); if(t){ const sys=t.closest(".tsys"); if(sys){ switchTab(sys,t.dataset.tab); persistMarks(); } return; }
  const g=e.target.closest("[data-toggle]"); if(g){ const root=g.closest(".tpane")||g.closest(".sroot"); const tgt=root.querySelector(`[data-tgt="${g.dataset.toggle}"]`)||st.querySelector(`[data-tgt="${g.dataset.toggle}"]`); if(tgt){ tgt.hidden=!tgt.hidden; persistMarks(); } return; }
  const k=e.target.closest("[data-key]"); if(k){ const box=k.closest(".calc"), inp=box.querySelector("[data-calcin]"), out=box.querySelector("[data-calcout]"); const v=k.dataset.key; if(v==="C"){ inp.value=""; out.textContent="= "; } else if(v==="=") out.textContent="= "+calcEval(inp.value); else inp.value+=v; }
});
app.addEventListener("keydown",e=>{ if(e.target.matches&&e.target.matches("[data-calcin]")&&e.key==="Enter"){ e.target.closest(".calc").querySelector("[data-calcout]").textContent="= "+calcEval(e.target.value); } });
document.addEventListener("fullscreenchange",()=>{ document.body.classList.toggle("fs-mode",!!document.fullscreenElement); const l=document.querySelector(".fs-lab"); if(l) l.textContent=document.fullscreenElement?"Exit full screen":"Full screen"; setTimeout(sizeInk,60); });

/* ================= actions ================= */
function pickAns(i){ if(S.revealed) return; const item=curItem(); S.picked=i; S.revealed=true; S.picks[curKey()]=i; if(S.mode==="solo") S.solo[curKey()]=i===item.answer?item.points:0; renderPanel(); }
function goTo(q){ S.q=q; const p=S.picks[curKey()]; S.revealed=p!==undefined; S.picked=p!==undefined&&p>=0?p:null; S.confirmClear=false;
  if(curItem().kind==="train"&&!(S.trainDone||{})[curKey()]) S.train={sel:[],result:null,attempts:0};
  render(); window.scrollTo({top:0}); }
function next(){ if(S.q===S.items.length-1) S.items.push(nextItem()); S.furthest=Math.max(S.furthest,S.q+1); goTo(S.q+1); }
function endSession(timeUp){ S.paused=true; S.pen=false; S.timeUp=!!timeUp; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); go("report"); }
app.addEventListener("click",e=>{
  const m=e.target.closest("#stage mark.hl"); if(m&&getSelection().isCollapsed&&!S.pen){ showMarkTool(m); return; }
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act,arg=el.dataset.arg;
  if(a!=="end"&&S.confirmEnd){ S.confirmEnd=false; renderBar(); }
  if(a!=="clearmarks"&&S.confirmClear){ S.confirmClear=false; const b=document.querySelector('[data-act="clearmarks"]'); if(b){ b.textContent="Clear marks"; b.classList.remove("danger"); } }
  switch(a){
    case "home": S.paused=true; S.pen=false; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); if(S.screen==="play") SAVED={...S}; go("home"); break;
    case "resume": S={...fresh(),...SAVED}; SAVED=null; S.paused=true; go(S.screen==="home"||S.screen==="setup"?(S.items.length?"play":"setup"):S.screen); break;
    case "solo": { const keep={diffs:S.diffs,limit:S.limit,custom:S.custom}; S=fresh(); Object.assign(S,keep); S.mode="solo"; SAVED=null; go("setup"); break; }
    case "class": { const keep={diffs:S.diffs,limit:S.limit,custom:S.custom}; S=fresh(); Object.assign(S,keep); S.mode="class"; S.teams=["Team 1","Team 2","Team 3"]; SAVED=null; go("setup"); break; }
    case "again": { const keep={mode:S.mode,teams:S.teams,diffs:S.diffs,limit:S.limit,custom:S.custom}; S=fresh(); Object.assign(S,keep); go("setup"); break; }
    case "diff": S.diffs[arg]=!S.diffs[arg]; render(); break;
    case "limit": S.limit=+arg; S.custom=false; render(); break;
    case "teams+": if(S.teams.length<6){ S.teams.push("Team "+(S.teams.length+1)); render(); } break;
    case "teams-": if(S.teams.length>2){ S.teams.pop(); render(); } break;
    case "startgame": S.teams=S.teams.map((t,i)=>t.trim()||"Team "+(i+1)); startGame(); break;
    case "end": if(!S.confirmEnd){ S.confirmEnd=true; renderBar(); break; } endSession(false); break;
    case "timer": S.paused=!S.paused; renderBar(); save(); break;
    case "pick": pickAns(+arg); break;
    case "reveal": S.revealed=true; S.picked=null; S.picks[curKey()]=-1; renderPanel(); break;
    case "jump": goTo(+arg); break;
    case "award": { const k=curKey(),t=+arg,l=S.awards[k]||[]; S.awards[k]=l.includes(t)?l.filter(x=>x!==t):[...l,t]; renderPanel(); break; }
    case "next": next(); break;
    case "big": S.big=!S.big; render(); break;
    case "fs": if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); } else { const r=document.documentElement.requestFullscreen?document.documentElement.requestFullscreen():Promise.reject(); r.catch(()=>{ S.big=true; render(); }); } break;
    case "note": addNote(null,""); break;
    case "pen": S.pen=!S.pen; el.setAttribute("aria-pressed",S.pen); document.getElementById("stage").classList.toggle("pen-on",S.pen); hideSelTool(); getSelection().removeAllRanges(); break;
    case "clearmarks": if(!S.confirmClear){ S.confirmClear=true; el.textContent="Tap again to clear"; el.classList.add("danger"); break; } S.confirmClear=false; { const k=curKey(); delete S.marks[k]; delete S.notes[k]; delete S.ink[k]; } render(); break;
    case "tsel": { const T=S.train; if(T.result) break; if(T.sel.includes(arg)) T.sel=T.sel.filter(x=>x!==arg); else if(T.sel.length<4) T.sel.push(arg); else break; const {d,pool}=labOf(curItem()); const p=pool.find(x=>x.id===arg),i=pool.indexOf(p); el.outerHTML=d.card(p,{btn:true,sel:T.sel.includes(arg),rot:PROT[i%PROT.length]}); renderPanel(); break; }
    case "tgo": { const T=S.train,k=curKey(),it=curItem(); T.attempts++; T.result=runLab(it,T.sel); S.trainDone=S.trainDone||{}; S.trainDone[k]=true; const pass=T.result.correct===T.result.n; S.picks[k]=pass?0:1; if(pass){ const p=T.attempts===1?it.points:Math.round(it.points/2); S.pts[k]=p; if(S.mode==="solo") S.solo[k]=p; else S.awards[k]=S.teams.map((_,i)=>i); } else if(S.mode==="solo") S.solo[k]=0; renderPanel(); break; }
    case "tretry": S.train.result=null; renderPanel(); break;
  }
});
app.addEventListener("input",e=>{ const t=e.target; if(t.dataset.custom){ const v=Math.max(1,Math.min(180,Math.round(+t.value||0))); if(+t.value>0){ S.limit=v; S.custom=true; document.querySelectorAll(".limits .lim").forEach(x=>{ x.classList.toggle("on",x===t.closest(".lim")); if(x.tagName==="BUTTON") x.setAttribute("aria-pressed","false"); }); save(); } return; } if(t.dataset.team!==undefined){ S.teams[+t.dataset.team]=t.value; save(); } else if(t.dataset.nb!==undefined){ S.nb=t.value; save(); } else if(t.dataset.ntext){ const n=findNote(t.dataset.ntext); if(n){ n.t=t.value; save(); } } });
document.addEventListener("keydown",e=>{ if(S.screen!=="play"||["INPUT","TEXTAREA"].includes(e.target.tagName)) return; const item=curItem(); if(item.kind==="train") return;
  if(!S.revealed&&/^[12]$/.test(e.key)) pickAns(+e.key-1); else if(S.revealed&&e.key==="ArrowRight") next(); else if(e.key==="Escape") hideSelTool(); });
setInterval(()=>{ if(S.screen!=="play"||S.paused) return;
  if(S.limit){ S.timeLeft--; if(S.timeLeft<=0){ S.timeLeft=0; endSession(true); return; } } else S.elapsed++;
  const el=document.getElementById("timer"),chip=document.getElementById("timerchip"); if(el) el.textContent=timeStr(); if(chip) chip.classList.toggle("low",!!S.limit&&S.timeLeft<=60);
  if((S.timeLeft+S.elapsed)%10===0) save(); },1000);

function start(data){
  if(data&&data.S){ S={...fresh(),...data.S}; }
  else { try{ const raw=localStorage.getItem(STORE); if(raw){ const p=JSON.parse(raw); if(p&&p.mode&&p.items&&p.items.length&&p.screen==="play") SAVED={...fresh(),...p}; } }catch(e){} }
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
