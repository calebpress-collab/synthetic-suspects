<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synthetic Suspects</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800;900&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Permanent+Marker&family=Playfair+Display:wght@700;900&display=swap">
<style>
/* Layout: an investigator's desk. Each exhibit is staged evidence (a phone screenshot, a browser window, or an illustrated place); the evidence form sits below it and the case notebook rides alongside on wide screens. Each case file has its own folder color. */
:root{
  --bg:#E4E1DA; --dot:#CFCAC0; --surface:#FBFAF7; --sunk:#EEEBE4; --ink:#16181D; --muted:#5C5F68; --line:#CFCAC0;
  --c0:#2B50D8; --c1:#C8361D; --c2:#0B7F70; --c3:#6B3CC9; --c4:#A86A00;
  --accent:var(--c0); --accent-ink:#FFFFFF;
  --mark:#FFE45C; --mark-ink:#16181D;
  --good:#13724A; --good-bg:#DCF1E5; --bad:#B23C08; --bad-bg:#FBE3D5;
  --paper:#FFFDF6; --paper-line:#D9E3EE;
  --f-display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-hand:'Caveat','Comic Sans MS',cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14161B; --dot:#22252D; --surface:#1C1F26; --sunk:#111318; --ink:#ECEAE4; --muted:#9EA2AD; --line:#30343E;
  --c0:#7F9BFF; --c1:#FF8A6B; --c2:#43CDB8; --c3:#B395FF; --c4:#F2B84B; --accent-ink:#0F1115;
  --mark:#EBCF3E; --mark-ink:#16181D;
  --good:#55CB92; --good-bg:#11301F; --bad:#F2925F; --bad-bg:#3A1D10;
  --paper:#23262E; --paper-line:#323848; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14161B; --dot:#22252D; --surface:#1C1F26; --sunk:#111318; --ink:#ECEAE4; --muted:#9EA2AD; --line:#30343E;
  --c0:#7F9BFF; --c1:#FF8A6B; --c2:#43CDB8; --c3:#B395FF; --c4:#F2B84B; --accent-ink:#0F1115;
  --mark:#EBCF3E; --mark-ink:#16181D;
  --good:#55CB92; --good-bg:#11301F; --bad:#F2925F; --bad-bg:#3A1D10;
  --paper:#23262E; --paper-line:#323848; color-scheme:dark }
[data-c="1"]{--accent:var(--c1)} [data-c="2"]{--accent:var(--c2)} [data-c="3"]{--accent:var(--c3)} [data-c="4"]{--accent:var(--c4)}

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body.class-mode{font-size:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.small{font-size:.88em;color:var(--muted)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.35em;letter-spacing:.04em;text-transform:uppercase;line-height:1;background:none;border:0;padding:0}
.brand span{color:var(--accent)}
.bar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:.85em;display:inline-flex;gap:6px;align-items:center}
.chip.low{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chip button{background:none;border:0;padding:0;font-size:.95em;color:var(--accent);font-weight:700}
.teams{max-width:1180px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.team-score{font-size:.85em;border-radius:6px;background:var(--sunk);padding:3px 10px}
.team-score b{font-family:var(--f-mono);margin-left:6px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap.wide{max-width:1180px}
.display{font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.9}
h2.display{font-size:clamp(2.4rem,6vw,3.6em)}
.lede{font-size:1.15em;max-width:56ch;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.btn{border:0;border-radius:8px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.danger{color:var(--bad)!important;border-color:var(--bad)!important}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero .tag{display:inline-block;background:var(--mark);color:var(--mark-ink);padding:2px 8px;font-family:var(--f-mono);font-size:.78em;letter-spacing:.1em;text-transform:uppercase;align-self:flex-start}
.hero h1{font-size:clamp(3.4rem,9vw,6.4rem)}
.hero h1 em{font-style:normal;color:var(--accent)}
.collage{position:relative;aspect-ratio:10/8.4;width:100%;max-width:520px;justify-self:center}
.print{position:absolute;width:38%;background:#fff;padding:3% 3% 10%;box-shadow:0 14px 30px rgba(0,0,0,.28);pointer-events:none;user-select:none}
.print .cap{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-family:var(--f-hand);font-size:clamp(14px,1.7vw,20px);color:#2a2a2a}
.print:nth-child(1){left:3%;top:9%;transform:rotate(-6deg)}
.print:nth-child(2){left:31%;top:2%;transform:rotate(3deg);z-index:2}
.print:nth-child(3){left:59%;top:11%;transform:rotate(-2deg)}
.pin{position:absolute;left:50%;top:-6px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8f7a,#c8361d 60%,#7c1d0e);transform:translateX(-50%);box-shadow:0 3px 4px rgba(0,0,0,.35);z-index:3}
.thumbf{aspect-ratio:4/5.2;overflow:hidden;position:relative;background:#ddd}
.thumbf.wide{aspect-ratio:4/3}
.thumbf .sroot{pointer-events:none}
.thumbf .shot{width:100%!important;box-shadow:none;border:0;border-radius:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.mode::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;background:var(--accent);opacity:.12;transform:rotate(45deg)}
.mode:hover{border-color:var(--accent)}
.mode h3{font-family:var(--f-display);font-weight:900;font-size:2.2em;text-transform:uppercase;line-height:1}
.mode p{color:var(--muted)}
.mode .go{margin-top:6px;color:var(--accent);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ftab{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:6px;padding:12px 14px}
.ftab b{display:block;font-family:var(--f-display);font-size:1.55em;text-transform:uppercase;line-height:1.05;font-weight:900}
.ftab span{color:var(--muted);font-size:.92em}

/* ---------- setup ---------- */
.teamlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.teamlist label{display:flex;flex-direction:column;gap:4px;font-size:.85em;color:var(--muted)}
.teamlist input{font:inherit;font-size:1.1em;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{background:var(--sunk);border:0;width:44px;height:44px;font-size:1.3em;font-weight:700}
.stepper span{min-width:52px;text-align:center;font-family:var(--f-mono);font-size:1.2em}

/* ---------- case board ---------- */
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sect h3{font-family:var(--f-display);font-weight:900;font-size:1.6em;text-transform:uppercase}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:22px}
.folder{text-align:left;background:none;border:0;padding:0;position:relative;display:block;padding-top:26px}
.folder .tab{position:absolute;left:18px;top:0;height:30px;padding:5px 16px 0;border-radius:8px 8px 0 0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.75em;letter-spacing:.1em;text-transform:uppercase}
.folder .body{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:4px 12px 12px 12px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 34%;gap:16px;align-items:center;min-height:180px}
.folder:hover .body{box-shadow:0 10px 24px rgba(0,0,0,.12)}
.folder h3{font-family:var(--f-display);font-weight:900;font-size:2.2em;text-transform:uppercase;line-height:.95}
.folder p{color:var(--muted);margin-top:6px}
.folder .mini{transform:rotate(3deg);box-shadow:0 8px 18px rgba(0,0,0,.25);background:#fff;padding:5%;pointer-events:none}
.folder.new .body{border-style:dashed;border-top-style:solid;grid-template-columns:1fr;background:transparent}
.folder.new .plus{font-family:var(--f-display);font-weight:900;font-size:3em;line-height:1;color:var(--accent)}
.status{display:inline-block;margin-top:12px;font-family:var(--f-mono);font-size:.75em;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--sunk)}
.status.solved{background:var(--good-bg);color:var(--good)}
.src{display:inline-block;margin-top:8px;margin-left:6px;font-size:.78em;color:var(--muted)}
.stampmini{position:absolute;right:22px;top:40px;transform:rotate(9deg);border:3px solid var(--good);color:var(--good);font-family:var(--f-display);font-weight:900;padding:0 8px;letter-spacing:.08em;background:var(--surface);z-index:2;font-size:1.2em}

/* ---------- generating ---------- */
.genlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.genlist li{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:8px}
.genlist li .dot{width:12px;height:12px;border-radius:50%;background:var(--good);flex:none}
.genlist li.wait .dot{background:var(--line);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.genlist li.wait .dot{animation:none}}
.choicecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}

/* ---------- intro ---------- */
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:flex-start}
.list li::before{content:"";flex:none;width:10px;height:10px;margin-top:.5em;background:var(--accent);transform:rotate(45deg)}
.brief{max-width:720px;display:flex;flex-direction:column;gap:18px}

/* ---------- play layout ---------- */
.playhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.playhead h2{font-family:var(--f-display);font-weight:900;font-size:2.1em;text-transform:uppercase;line-height:1}
.progress{display:flex;gap:4px}
.progress i{width:22px;height:6px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)} .progress i.cur{background:var(--ink)}
.playgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"tools" "stage" "panel" "notes"}
@media (min-width:1100px){.playgrid{grid-template-columns:minmax(0,1fr) 270px;grid-template-areas:"tools notes" "stage notes" "panel notes";align-items:start}}
.tools{grid-area:tools;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tools .lab{font-family:var(--f-mono);font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 10px;font-size:.88em;font-weight:700}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool svg{width:16px;height:16px}
.stage-area{grid-area:stage;min-width:0}
.panel-area{grid-area:panel;min-width:0;display:flex;flex-direction:column;gap:14px}
.notes-area{grid-area:notes;min-width:0}

/* ---------- stage + overlays ---------- */
.stage{position:relative}
.stage.pen-on{touch-action:none}
.stage.pen-on .sroot{user-select:none}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.pen-on .ink{pointer-events:auto;cursor:crosshair}
.notes-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.sticky{position:absolute;width:clamp(130px,22%,210px);pointer-events:auto;box-shadow:0 8px 14px rgba(0,0,0,.28);transform:rotate(-1.5deg);display:flex;flex-direction:column}
.sticky.c-y{background:#FFE77A} .sticky.c-p{background:#FFC2D8} .sticky.c-b{background:#BFE4FF} .sticky.c-g{background:#C9F0BF}
.sticky .grip{display:flex;align-items:center;gap:4px;padding:3px 6px;cursor:grab;touch-action:none;background:rgba(0,0,0,.06);color:#2b2b2b;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.sticky .grip span{flex:1}
.sticky .grip button{background:none;border:0;padding:0 4px;font-size:14px;line-height:1;color:#2b2b2b}
.sticky textarea{border:0;background:transparent;resize:none;font-family:var(--f-hand);font-size:20px;line-height:1.15;color:#1f1f1f;padding:6px 8px 10px;min-height:86px;width:100%}
.sticky textarea::placeholder{color:rgba(0,0,0,.4)}
.stamp-host{position:absolute;right:2%;top:3%;z-index:6;pointer-events:none}
.stamp{display:block;font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:.08em;text-transform:uppercase;border:4px solid currentColor;padding:0 14px;border-radius:6px;transform:rotate(-9deg);background:rgba(255,255,255,.94);animation:stamp .38s cubic-bezier(.2,1.6,.4,1) both}
.stamp.good{color:#13724A} .stamp.bad{color:#B23C08} .stamp.neutral{color:#1f3fb8}
@keyframes stamp{from{transform:rotate(-9deg) scale(1.9);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
mark.hl{color:inherit;border-radius:2px;padding:0 .05em;cursor:pointer}
mark.hl-y{background:rgba(255,226,64,.75)} mark.hl-p{background:rgba(255,120,170,.55)} mark.hl-b{background:rgba(90,190,255,.5)}
#seltool{position:fixed;z-index:50;display:flex;gap:4px;align-items:center;background:#16181D;color:#fff;border-radius:10px;padding:6px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
#seltool button{background:none;border:0;color:#fff;font-size:13px;font-weight:700;padding:4px 8px;border-radius:6px}
#seltool button:hover{background:rgba(255,255,255,.12)}
#seltool .sw{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.7)}
#seltool .sw.y{background:#FFE240} #seltool .sw.p{background:#FF78AA} #seltool .sw.b{background:#5ABEFF}

/* ---------- notebook ---------- */
.notebook{background:var(--paper);border:1px solid var(--line);border-radius:6px 12px 12px 6px;box-shadow:0 8px 18px rgba(0,0,0,.08);overflow:hidden;position:relative}
.notebook::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 16px)}
.nb-head{padding:12px 14px 6px 24px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nb-head b{font-family:var(--f-display);font-weight:900;font-size:1.4em;text-transform:uppercase;line-height:1}
.notebook textarea{display:block;width:100%;min-height:220px;border:0;resize:vertical;background:transparent;color:var(--ink);font-family:var(--f-hand);font-size:22px;line-height:30px;padding:2px 14px 14px 24px;
  background-image:repeating-linear-gradient(transparent 0 29px,var(--paper-line) 29px 30px);background-attachment:local}
@media (min-width:1100px){.notebook textarea{min-height:520px}}
.nb-foot{padding:6px 14px 10px 24px;font-size:.78em;color:var(--muted)}

/* ---------- evidence form ---------- */
.form{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:4px 4px var(--r) var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.ctx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.ctx .eyebrow{white-space:nowrap}
.question{font-size:1.28em;font-weight:700;line-height:1.3;max-width:56ch}
.opts{display:grid;gap:10px}
.opts.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--sunk)}
.opt .k{font-family:var(--f-mono);font-weight:600;font-size:.85em;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);flex:none;margin-top:2px}
.opt .k.num{border-radius:50%;width:1.7em;height:1.7em;padding:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .k{border-color:var(--good);color:var(--good)} .opt.right .k.num{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)} .opt.wrong .k.num{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.feedback{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.verdict{font-weight:700;font-size:1.1em}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.tagline{display:inline-block;font-family:var(--f-mono);font-size:.75em;letter-spacing:.08em;text-transform:uppercase;background:var(--mark);color:var(--mark-ink);padding:2px 8px;border-radius:3px;align-self:flex-start}
.explain{max-width:68ch}
.awards{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:8px;padding:12px 14px}
.awards .row{gap:8px}
.award{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700}
.award.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.tests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tests{grid-template-columns:repeat(2,minmax(0,1fr))}}
.learned{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.learned b{font-family:var(--f-display);font-size:1.6em;text-transform:uppercase;background:var(--mark);color:var(--mark-ink);padding:0 8px;line-height:1.2}

/* ---------- debrief / final ---------- */
.discuss{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:22px}
.discuss .eyebrow{color:inherit;opacity:.7}
.discuss p{font-size:1.35em;font-weight:700;line-height:1.35;margin-top:8px}
.bigscore{font-family:var(--f-display);font-weight:900;font-size:clamp(3rem,9vw,5rem);line-height:1}
.ranktitle{display:inline-block;font-family:var(--f-display);font-weight:900;font-size:clamp(2rem,6vw,3rem);text-transform:uppercase;border:4px solid var(--accent);color:var(--accent);padding:2px 16px;transform:rotate(-3deg);border-radius:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.n{text-align:right;font-family:var(--f-mono)}
.tablewrap{overflow-x:auto}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{font-size:.8em;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.ladder span.me{background:var(--accent);color:var(--accent-ink)}

/* =========================================================
   EVIDENCE. Physical objects keep real-world colors in both themes.
   ========================================================= */
.sroot{color:#111}

/* ----- phone screenshots ----- */
.st-phone{display:flex;justify-content:center;gap:3%}
.shot{container:shot / inline-size;width:min(100%,calc(min(76vh,780px)*.4615));aspect-ratio:9/19.5;border-radius:7% / 3.3%;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.12);flex:none;background:#fff}
.st-phone.two .shot{width:min(48%,calc(min(76vh,780px)*.4615))}
.scr{position:relative;height:100%;display:flex;flex-direction:column;font-size:4.1cqw;color:#111;background:#FFF;font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.32}
.st-phone.two .scr{font-size:4.5cqw}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:.9em 1.6em .3em;height:3em;font-weight:600;font-size:.88em;flex:none;position:relative;z-index:2}
.sbar.light{color:#fff}

.sbar .bat::after{content:"";position:absolute;inset:.1em;right:30%;background:currentColor;border-radius:.1em}
.ma-head{flex:none;text-align:center;padding:.3em 1em .6em;border-bottom:1px solid #E5E5EA;background:#F7F7F9;position:relative}
.ma-back{position:absolute;left:.8em;top:1.1em;color:#0A84FF;font-size:1.3em}
.ma-av{width:2.6em;height:2.6em;border-radius:50%;margin:0 auto .25em;background:linear-gradient(#A6ADBB,#7B8394);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85em}
.ma-title{font-weight:600;font-size:.88em}
.ma-sub{font-size:.7em;color:#8E8E93}
.ma-body{flex:1;padding:.8em .8em;display:flex;flex-direction:column;gap:.3em;overflow:hidden;min-height:0}
.ma-time{text-align:center;color:#8E8E93;font-size:.72em;margin:.2em 0 .4em}
.who-s{font-size:.7em;color:#8E8E93;margin:.4em 0 0 .9em}
.bub{max-width:78%;padding:.5em .8em;border-radius:1.15em;line-height:1.3}
.bub.them{background:#E9E9EB;align-self:flex-start;border-bottom-left-radius:.35em}
.bub.me{background:#0A84FF;color:#fff;align-self:flex-end;border-bottom-right-radius:.35em}
.composer{flex:none;margin:.5em .8em 1.4em;border:1px solid #D1D1D6;border-radius:1.4em;padding:.5em 1em;color:#8E8E93;font-size:.95em;display:flex;justify-content:space-between;gap:.5em;align-items:center}
.composer.typed{color:#111;align-items:flex-end}
.send{width:1.6em;height:1.6em;border-radius:50%;background:#0A84FF;flex:none}
.logo-dot{width:1.7em;height:1.7em;border-radius:50%;background:conic-gradient(#FF8A3D,#FFD23D,#3DD6B0,#5B7CFF,#C25BFF,#FF8A3D);flex:none;box-shadow:inset 0 0 0 .3em rgba(255,255,255,.55)}
.bm-head{flex:none;display:flex;gap:.5em;align-items:center;justify-content:center;padding:.3em 1em .7em;font-weight:700;border-bottom:1px solid #EEE}
.bm-head .logo-dot{width:1.3em;height:1.3em}
.bm-body{flex:1;display:flex;flex-direction:column;gap:.9em;padding:1em .9em;overflow:hidden;min-height:0}
.u-msg{align-self:flex-end;background:#EEF0F6;border-radius:1.15em;padding:.55em .95em;max-width:82%}
.b-msg{display:flex;gap:.55em;line-height:1.55;align-items:flex-start}
.b-msg .t{min-width:0}
.sent .n{display:inline-grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;background:#1F3FB8;color:#fff;font-size:.62em;font-weight:700;vertical-align:.25em;margin-right:.3em;font-family:var(--f-mono);user-select:none}
.sent.flag{background:#FFE45C;box-shadow:0 0 0 .18em #FFE45C;border-radius:.15em}
.sent.flag .n{background:#C8361D}
.sent.miss{text-decoration:line-through;text-decoration-color:#C8361D;text-decoration-thickness:.12em}
.vm-h{font-size:1.9em;font-weight:700;padding:.2em .7em .4em}
.vm-card{margin:0 .8em;background:#F2F2F7;border-radius:1em;padding:.9em 1em;display:flex;flex-direction:column;gap:.55em}
.vm-who{font-weight:700;font-size:1.15em}
.vm-meta{color:#8E8E93;font-size:.82em}
.wave{display:flex;align-items:center;gap:.14em;height:3.2em}
.wave i{flex:1;background:#0A84FF;border-radius:.2em}
.wave i.p{background:#B9D7FF}
.vm-ctrl{display:flex;justify-content:space-between;align-items:center;color:#0A84FF;font-size:.85em}
.play{width:2.5em;height:2.5em;border-radius:50%;background:#0A84FF;position:relative}
.play::after{content:"";position:absolute;inset:.75em .6em .75em .95em;background:#fff;clip-path:polygon(0 0,100% 50%,0 100%)}
.vm-tr{font-size:.95em;line-height:1.45}
.vm-tr b{display:block;color:#8E8E93;font-size:.72em;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2em}
.vm-old{margin:.9em .8em 0;display:flex;flex-direction:column}
.vm-old div{display:flex;justify-content:space-between;padding:.6em .2em;border-bottom:1px solid #E5E5EA;font-size:.9em}
.vm-old span{color:#8E8E93;font-size:.85em}
.lock{position:absolute;inset:0;background:linear-gradient(165deg,#2D4373,#6E558F 55%,#C9836E);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center}
.lock-date{font-size:1.05em;font-weight:600;opacity:.9;margin-top:2.6em}
.lock-time{font-size:5em;font-weight:600;line-height:1;letter-spacing:-.02em}
.lock svg{width:4.6em;margin-top:3.4em}
.lock-msg{margin-top:.9em;font-weight:700;font-size:1.1em}
.lock-sub{font-size:.85em;opacity:.85;margin-top:.2em}
.lock-pill{margin-top:auto;margin-bottom:2.6em;background:rgba(255,255,255,.22);border-radius:2em;padding:.5em 1.4em;font-weight:600;font-size:.9em}
.feed-h{display:flex;justify-content:space-between;align-items:center;padding:.3em 1em .6em;font-weight:800;font-size:1.25em}
.feed-tabs{display:flex;gap:1.2em;padding:0 1em .6em;font-weight:600;color:#888;font-size:.9em;border-bottom:1px solid #EEE}
.feed-tabs b{color:#111;border-bottom:.15em solid #111;padding-bottom:.3em}
.feed-row{display:flex;gap:.8em;padding:.7em 1em;border-bottom:1px solid #F0F0F0;align-items:center}
.feed-row i{width:6.4em;aspect-ratio:16/10;border-radius:.4em;flex:none;background:linear-gradient(135deg,var(--a),var(--b))}
.feed-row b{display:block;font-size:.92em;line-height:1.25}
.feed-row span{font-size:.75em;color:#888}

/* ----- browser window (no device) ----- */
.win{container:win / inline-size;width:100%;border-radius:10px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.25);border:1px solid rgba(0,0,0,.15);background:#fff}
.win-in{font-size:1.22cqw;aspect-ratio:16/10;display:flex;flex-direction:column;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.35;color:#111}

.chrome{flex:none;display:flex;align-items:center;gap:.7em;padding:.45em .8em;background:#ECECEF;border-bottom:1px solid #D4D4D8;font-size:.82em}
.dots{display:flex;gap:.35em}
.dots i{width:.8em;height:.8em;border-radius:50%;display:block}
.dots i:nth-child(1){background:#FF5F57}.dots i:nth-child(2){background:#FEBC2E}.dots i:nth-child(3){background:#28C840}
.url{flex:1;background:#FFF;border-radius:.5em;padding:.25em .8em;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pg{flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.sx{display:grid;grid-template-columns:17% minmax(0,1fr) 24%;flex:1;min-height:0;background:#F6F6F7}
.sx-l{padding:1.2em 1.2em;display:flex;flex-direction:column;gap:.9em;font-weight:600;color:#333;border-right:1px solid #E7E7EA;background:#fff}
.sx-l .logo{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:1.6em;color:#111;margin-bottom:.4em}
.sx-c{padding:1em 1.4em;overflow:hidden;min-width:0;display:flex;justify-content:center}
.post{background:#fff;border:1px solid #E3E3E6;border-radius:.8em;overflow:hidden;width:100%;max-width:34em;align-self:flex-start}
.post-h{display:flex;gap:.6em;align-items:center;padding:.7em .9em}
.soc-av{width:2.2em;height:2.2em;border-radius:50%;background:radial-gradient(#3A2A5C 55%,transparent 56%),conic-gradient(#FEDA75,#FA7E1E,#D62976,#962FBF,#FEDA75);flex:none}
.post svg{display:block;width:100%;height:auto}
.post-a{display:flex;gap:1.3em;padding:.6em .9em .2em;font-weight:600;font-size:.92em}
.post-c{padding:.2em .9em .3em;font-size:.95em}
.post-m{padding:.2em .9em .8em;color:#8A8A8E;font-size:.82em}
.sx-r{padding:1.2em;display:flex;flex-direction:column;gap:.8em;border-left:1px solid #E7E7EA;background:#fff;font-size:.9em}
.sx-r b{font-size:1.05em}
.sx-r div span{display:block;color:#888;font-size:.85em}
.ig-wrap{padding:1em 1.4em;overflow:hidden}
.ig-q{display:flex;gap:.6em;align-items:center;border:1px solid #DDD;border-radius:2em;padding:.4em 1em;max-width:34em;margin-bottom:1em}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em}
.ig div{border-radius:.6em;overflow:hidden;background:#F1F1F3;font-size:.82em}
.ig div i{display:block;aspect-ratio:1;background:radial-gradient(circle at 50% 38%,#C9B39A 0 15%,transparent 15.5%),radial-gradient(ellipse at 50% 92%,#FFFFFF 0 34%,transparent 34.5%),linear-gradient(#DCE6EE,#C3D2DE)}
.ig div span{display:block;padding:.4em .6em}

/* ----- illustrated scenes ----- */
.scwrap{container:scw / inline-size;width:100%}
.sc{container:sc / inline-size;position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:var(--r);isolation:isolate;box-shadow:0 18px 40px rgba(0,0,0,.25)}
@container scw (max-width:600px){.sc{aspect-ratio:9/14}}
.dev{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);transform:translate(-50%,var(--ty,-50%)) rotate(var(--rot))}
@container sc (max-width:600px){
  .dev{left:calc(var(--mx)*1%);top:calc(var(--my)*1%);transform:translate(-50%,var(--mty,-50%)) rotate(calc(var(--rot)*.5))}
  .dh{display:none!important}
}
.prop{pointer-events:none;position:absolute}

.pens{width:5cqw;height:6.5cqw;background:linear-gradient(90deg,#2F5E8E,#4E7FB0 40%,#2A527C);border-radius:.3cqw;z-index:3}

.ixnote{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:.82em;color:var(--muted)}
.ixnote i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:ixp 2.4s ease-out 3}

.slide.title{background:var(--sa);color:var(--sb)}
.slide.title::before{display:none}
.sl-in{position:absolute;inset:8% 7% 8% 9%;display:flex;flex-direction:column}
.slide.title .sl-in{justify-content:center;inset:10%}
.slide h4{font-size:3.2em;margin:0;line-height:1;font-weight:800}
.sl-by{margin-top:.6em;font-size:1.1em;opacity:.85}
.slide h5{font-size:2em;margin:0 0 .5em;font-weight:800}
.sl-row{display:flex;gap:1.4em;flex:1;min-height:0}
.sl-row ul{flex:1;margin:0;padding-left:1.1em;font-size:1.25em;line-height:1.45}
.sl-img{width:36%;flex:none;display:flex;align-items:center}
.sl-img svg{width:100%;height:auto;border-radius:.3em}
.ph{display:grid;place-items:center;width:100%;aspect-ratio:4/3;border:.15em dashed currentColor;font-size:.9em;opacity:.7;text-align:center;padding:.4em}
.sl-num{position:absolute;right:3%;bottom:4%;font-size:.8em;opacity:.6}
.pj{width:76cqw;font-size:1.1cqw;box-shadow:0 0 6cqw rgba(200,220,255,.28)}
.pj .tpane{position:relative}
.pj-ctl{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-top:.6em;color:#DDE3F0;font-size:1.2em}
.pj-ctl button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:2.2em;height:2.2em;font-size:1.2em}
.pj-ctl button:hover{background:rgba(255,255,255,.3)}
@container sc (max-width:600px){ .pj{width:94cqw;font-size:1.5cqw} }
.dk{display:flex;flex-direction:column;flex:1;min-height:0;background:#F1F3F4}
.dk-top{display:flex;gap:1em;align-items:center;padding:.5em 1.2em;background:#fff;border-bottom:1px solid #DDD;font-size:.88em}
.dk-top b{color:#E0A02A;font-size:1.15em}
.dk-top span{flex:1;color:#555}
.dk-pres{flex:none!important;background:#1A56D6;color:#fff!important;border-radius:.4em;padding:.25em .9em}
.dk-sys{flex-direction:row}
.dk-thumbs{flex-direction:column;align-items:stretch;width:22%;background:#E8EAED;padding:.6em;gap:.4em;overflow-y:auto}
.dk-th{display:flex;gap:.5em;max-width:none;border-radius:.4em;padding:.5em;background:#fff;text-align:left;font-size:.75em;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.dk-th.on{outline:.18em solid #E0A02A}
.dk-tn{color:#888}
.dk-tt{white-space:normal!important}
.dk-stage{padding:1em 1.4em .6em;font-size:.72em}
.dk-notes{margin:0 1.4em 1em;background:#fff;border:1px solid #DDD;border-radius:.4em;padding:.6em .8em;font-size:.85em;color:#444}
.dk-notes b{display:block;font-size:.8em;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.2em}
@container sc (max-width:600px){ .dk-sys{flex-direction:column} .dk-thumbs{width:100%;flex-direction:row;overflow-x:auto} .dk-th{min-width:8em} .dk-stage{font-size:.6em} }

/* ---------- quiz + log ---------- */
.qz,.lg{display:flex;flex-direction:column;flex:1;min-height:0}
.qz-top{display:flex;gap:1em;align-items:baseline;justify-content:space-between;padding:.6em 1.4em;background:#2E1F6B;color:#fff;font-size:.9em}
.qz-sys{flex:1}
.qz-tabs{background:#EEEAF8;padding:.5em 1em 0}
.qz-tabs .ttab{font-weight:700}
.qz-q{padding:1.2em 1.6em}
.qz-q>span{font-size:.78em;color:#777}
.qz-q h4{font-size:1.3em;margin:.3em 0 .8em}
.qz-a{border:1px solid #DDD;border-radius:.5em;padding:.8em 1em;background:#FAFAFC;line-height:1.55;min-height:5em}
.qz-m{display:flex;gap:1.4em;flex-wrap:wrap;margin-top:.8em;font-size:.8em;color:#666}
.lg table{width:calc(100% - 2.8em);margin:1em 1.4em;font-size:.88em;font-family:var(--f-mono)}
.lg td,.lg th{padding:.35em .5em;border-bottom:1px solid #EEE;color:#222}
.lg th{color:#888}

/* ---------- recipe ---------- */
.rc-top{display:flex;gap:1em;align-items:baseline;padding:.6em 1.4em;border-bottom:3px solid #E07A2B}
.rc-top b{color:#E07A2B;font-size:1.4em;font-family:Georgia,serif;font-style:italic}
.rc-top span{color:#888;font-size:.85em}
.rc-body{padding:1em 1.6em;line-height:1.55}
.rc-body h4{font-family:Georgia,serif;font-size:1.9em;margin:0 0 .2em}
.rc-body h5{font-size:1.15em;margin:1.2em 0 .4em}
.rc-meta{font-size:.82em;color:#777;margin-bottom:.8em}
.rc-body p{margin:0 0 .7em}
.rc-card{border:2px solid #E07A2B;border-radius:.8em;padding:1em 1.2em;margin:1em 0;background:#FFFAF4}
.rc-card h5{margin:0;font-family:Georgia,serif;font-size:1.4em}
.rc-y{font-size:.85em;color:#A0521C;margin-bottom:.6em}
.rc-cols{display:grid;grid-template-columns:1fr 1.6fr;gap:1.4em}
.rc-cols ul,.rc-cols ol{margin:.3em 0 0;padding-left:1.2em}
@container sc (max-width:600px){ .rc-cols{grid-template-columns:1fr} }

/* ---------- flyers ---------- */
.fy{width:42cqw;font-size:1.5cqw;box-shadow:0 1.4cqw 2.4cqw rgba(0,0,0,.3)}
@container sc (max-width:600px){ .fy{width:84cqw;font-size:3cqw} }
.fy-ai{background:linear-gradient(160deg,#5B2BE0,#C8367A 60%,#FF8A3D);color:#fff;padding:1.4em;text-align:center;font-family:-apple-system,'Segoe UI',sans-serif}
.fy-img{position:relative;border-radius:.6em;overflow:hidden;margin-bottom:.8em}
.fy-img svg{display:block;width:100%;height:auto}
.fy-g{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:#5B2BE0;font-family:'Arial Black',sans-serif;font-size:1.3em;padding:.1em .6em;border-radius:.3em;white-space:nowrap}
.fy-ai h5{font-size:2.4em;margin:0 0 .3em;line-height:1;font-weight:900}
.fy-tag{margin:0 0 .8em;opacity:.95}
.fy-d{display:flex;flex-direction:column;gap:.3em;background:rgba(255,255,255,.18);border-radius:.5em;padding:.7em;margin-bottom:.6em}
.fy-s{margin:0;font-size:.85em;opacity:.85}
.fy-h{background:#FFFDF4;color:#1D3E9C;padding:1.4em 1.4em 0;font-family:'Permanent Marker','Comic Sans MS',cursive;line-height:1.3}
.fy-h h5{font-size:2.6em;margin:0 0 .3em;color:#C62828;font-weight:400;line-height:1}
.fy-h p{margin:0 0 .4em;font-size:1.15em}
.fy-h s{color:#999}
.fy-tabs{display:flex;margin:1em -1.4em 0;border-top:.1em dashed #999}
.fy-tabs span{flex:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.65em;padding:.6em .2em;border-left:.1em dashed #999;height:9em;font-family:var(--f-hand);text-align:center}

/* ---------- v8: setup, labels, timer ---------- */
.setup{display:grid;gap:22px}
.srow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:start;border-bottom:1px dashed var(--line);padding-bottom:18px}
.srow:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:640px){.srow{grid-template-columns:1fr}}
.toggles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.toggles{grid-template-columns:1fr}}
.tgl{text-align:left;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px;opacity:.6}
.tgl b{font-family:var(--f-display);font-size:1.5em;text-transform:uppercase;line-height:1}
.tgl span{font-size:.82em;color:var(--muted)}
.tgl.on{opacity:1}
.tgl.easy.on{border-color:var(--good);background:var(--good-bg)} .tgl.medium.on{border-color:#E0A02A;background:#FFF1D2} .tgl.hard.on{border-color:var(--bad);background:var(--bad-bg)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tgl.medium.on{background:#3A2C10} }
:root[data-theme="dark"] .tgl.medium.on{background:#3A2C10}
.tgl::after{content:"Off";font-family:var(--f-mono);font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tgl.on::after{content:"✓ On";color:var(--ink)}
.limits{display:flex;gap:8px;flex-wrap:wrap}
.lim{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700}
.lim.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .pp{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.chip .pp svg{width:12px;height:12px}
.chip .inf{font-size:1.1em;color:var(--muted)}
.cattag{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:1em;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);padding:2px 10px;border-radius:4px}
.ixpill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:.9em;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--line);color:var(--muted);background:var(--surface)}
.ixpill svg{width:18px;height:18px}
.ixpill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent);animation:ixp2 2s ease-out 2}
@keyframes ixp2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.ixpill.on{animation:none}}
.pdot[data-c="0"].on{background:var(--c0)} .pdot[data-c="1"].on{background:var(--c1)} .pdot[data-c="2"].on{background:var(--c2)} .pdot[data-c="3"].on{background:var(--c3)}
.progress{flex-wrap:wrap;max-width:min(100%,560px);justify-content:flex-end;gap:5px}

/* equal-width browser tabs */
.tsys>.tstrip:not(.ib-list):not(.dk-thumbs):not(.pstrip):not(.qz-tabs)>.ttab{flex:1 1 0;max-width:13em;min-width:0}

/* source link in chatbot answers */
.src-l{margin-top:.8em;font-size:.92em;color:#555;border-top:1px solid #EEE;padding-top:.5em}
.src-l .lnk{font-weight:600}

/* chalkboard + lined paper */
.chalk-b{width:80cqw;font-size:2.3cqw;background:radial-gradient(ellipse at 40% 30%,#3C5A48,#24392D 75%);border:.6em solid #7A5230;border-radius:.3em;box-shadow:0 1.4cqw 2.6cqw rgba(0,0,0,.35),inset 0 0 2em rgba(0,0,0,.4);padding:1.2em 2em 1.8em;color:#F3F1E8;font-family:var(--f-hand);line-height:1.3;position:relative}
.chalk-b h5{margin:0 0 .4em;font-size:1.5em;font-weight:700;border-bottom:.06em solid rgba(243,241,232,.5)}
.chalk-b .ok{color:#C9F0BF} .chalk-b .no{color:#FFB8B8} .chalk-b .q{color:#FFE9A8}
.chalk-b .sig{text-align:right}
.chalk-b ul{margin:.2em 0 .4em;padding-left:1.2em}
.chalk-b p,.wb.note p{margin:0 0 .4em}
.ledge{position:absolute;left:4%;right:4%;bottom:-1.6em;height:.9em;background:#8A6040;border-radius:.2em}
.ledge::after{content:"";position:absolute;left:14%;top:-.35em;width:2.4em;height:.45em;background:#F3F1E8;border-radius:.2em}
@container sc (max-width:600px){ .chalk-b{width:94cqw;font-size:4cqw;padding:1em 1.2em 1.6em} }
.wb.note ul{margin:.2em 0 .4em;padding-left:1.2em}
.lined{width:52cqw;font-size:1.9cqw;background-color:#FFFFFF;background-image:linear-gradient(90deg,transparent 3.6em,#E9A0A0 3.6em calc(3.6em + 1px),transparent calc(3.6em + 1px)),repeating-linear-gradient(transparent 0 calc(1.6em - 1px),#B9D3EA calc(1.6em - 1px) 1.6em);background-position:0 0,0 2.2em;padding:2.4em 1.6em 3em 4.4em;color:#1D3E9C;font-family:var(--f-hand);line-height:1.6em;box-shadow:0 1.4cqw 2.6cqw rgba(0,0,0,.3);position:relative}
.lined::before{content:"";position:absolute;left:1.2em;top:3em;bottom:3em;width:.8em;background:radial-gradient(circle,#D6D0C4 0 .35em,transparent .4em) 0 0/100% 33%}
.lined h5{margin:0;font-size:1.3em;line-height:1.6em}
.lined p{margin:0}
.lined ul{margin:0;padding-left:1.1em}
@container sc (max-width:600px){ .lined{width:92cqw;font-size:3.8cqw} }

/* clutter on harder sites */
.bz{display:flex;flex-direction:column;min-height:100%}
.bz-cookie{position:sticky;top:0;z-index:2;background:#1F2937;color:#F3F4F6;font-size:.8em;padding:.6em 1.2em;display:flex;gap:1em;align-items:center;flex-wrap:wrap}
.bz-cookie[hidden]{display:none}
.bz-cookie .lnk{color:#93C5FD}
.bz-nav{display:flex;gap:1.4em;padding:.5em 1.4em;border-bottom:1px solid #E5E7EB;font-size:.82em;color:#4B5563;background:#FAFAFA}
.bz-grid{display:grid;grid-template-columns:minmax(0,1fr) 13em;gap:0;flex:1}
.bz-side{border-left:1px solid #EEE;padding:1em;display:flex;flex-direction:column;gap:.6em;font-size:.82em;background:#FCFCFC}
.bz-side b{font-size:1.05em}
.bz-side .lnk.dead{color:#1A56D6;cursor:default}
.bz-ad{margin-top:.6em;background:repeating-linear-gradient(45deg,#F3F4F6 0 8px,#E5E7EB 8px 16px);border:1px solid #D1D5DB;padding:1.4em .6em;text-align:center;color:#6B7280;font-size:.85em}
.bz-news{border:1px solid #DDD;border-radius:.4em;padding:.6em;display:flex;flex-direction:column;gap:.3em}
.bz-news span{border:1px solid #DDD;border-radius:.3em;padding:.2em .5em;color:#999}
.bz-foot{margin:1em 1.6em 1.4em;border-top:1px solid #EEE;padding-top:.8em;font-size:.8em;color:#6B7280;display:flex;flex-direction:column;gap:.3em}
@container sc (max-width:600px){ .bz-grid{grid-template-columns:1fr} .bz-side{border-left:0;border-top:1px solid #EEE} }

/* ===================== v9 ===================== */
/* scroll-up hint on chats */
.bw-main{position:relative}
.su{position:absolute;left:50%;transform:translate(-50%,-.4em);z-index:4;width:2em;height:2em;border-radius:50%;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.94);color:#3A3A40;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 .15em .5em rgba(0,0,0,.18);padding:0;backdrop-filter:blur(4px)}
.su svg{width:1.15em;height:1.15em}
.su.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);animation:su-bob 1.8s ease-in-out 2}
.su:hover{opacity:1}
@keyframes su-bob{50%{transform:translate(-50%,-.25em)}}
@media (prefers-reduced-motion:reduce){.su.show{animation:none}}
#stage .su{cursor:pointer}
/* chat extras */
.bts{font-size:.62em;color:#8E8E93;margin:.1em 0 .2em .9em}
.bts.r{align-self:flex-end;margin:.1em .9em .2em 0}
.ma-sys{align-self:center;font-size:.68em;color:#6B6B70;background:#F2F2F5;border-radius:1em;padding:.25em .8em;margin:.2em 0}
/* booklets */
.bk{width:52cqw;font-size:1.25cqw;background:linear-gradient(170deg,#FFFDF7,#F3EEE2);color:#1F1F1F;padding:2.2em 2.6em 1.6em;box-shadow:0 1.6cqw 3cqw rgba(0,0,0,.45);font-family:Georgia,'Times New Roman',serif}
.bk-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.12em solid #222;padding-bottom:.4em;margin-bottom:.8em}
.bk-h span{font-size:.8em;letter-spacing:.08em;text-transform:uppercase;color:#555}
.bk-h b{font-size:1.6em;font-style:italic}
.bk-sub{font-size:.75em;letter-spacing:.14em;text-transform:uppercase;color:#8A6A2A;margin-bottom:.4em}
.pm{margin:0 0 1.2em}
.pm h5{font-size:1.25em;margin:0 0 .4em}
.pm-b{white-space:pre-line;line-height:1.5}
.pm-by{margin-top:.4em;font-style:italic;color:#555;font-size:.9em}
.bk-note{font-size:.8em;color:#666;border-top:1px dashed #AAA;padding-top:.6em}
.bk-sp{width:56cqw;font-size:1.12cqw;background:#F7F5EF}
.sp-mast{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:2.4em;text-align:center;line-height:1;border-bottom:.08em solid #111;padding-bottom:.2em}
.sp-mast.sm{font-size:1.3em;text-align:left}
.sp-date{text-align:center;font-size:.75em;letter-spacing:.12em;text-transform:uppercase;padding:.35em 0;border-bottom:1px solid #111;margin-bottom:.8em}
.sp-hed{font-family:'Playfair Display',Georgia,serif;font-size:2em;font-weight:800;line-height:1.05}
.sp-by{font-size:.8em;color:#555;margin:.4em 0 .6em;font-style:italic}
.sp-cols{columns:2;column-gap:1.6em;line-height:1.5}
.sp-cols p{margin:0 0 .6em}
.sp-box{margin-top:.8em;border:1px solid #999;padding:.4em .7em;font-size:.82em}
.sp-two{display:grid;grid-template-columns:1.6fr 1fr;gap:1.4em;margin-top:.8em}
.sp-k{font-size:.75em;letter-spacing:.1em;text-transform:uppercase;color:#7A1F3D;margin-bottom:.5em;font-family:-apple-system,'Segoe UI',sans-serif;font-weight:700}
.sp-old{border-bottom:1px solid #CCC;padding-bottom:.5em;margin-bottom:.6em;line-height:1.45}
.sp-old b{display:block;font-size:1.1em;margin-bottom:.2em}
.sp-old p{margin:0 0 .4em}
.sp-staff{display:flex;flex-direction:column;gap:.35em;font-size:.82em;border:1px solid #111;padding:.7em .8em;align-self:start}
.sp-staff b{text-transform:uppercase;letter-spacing:.12em}
.sp-fine{color:#666;font-style:italic;margin-top:.3em}
/* exit tickets */
.tk-prompt{position:absolute;left:50%;top:5%;transform:translateX(-50%);background:#FFF;padding:.4em 1em;font-family:var(--f-body);font-size:1.5cqw;font-weight:700;box-shadow:0 .4cqw .8cqw rgba(0,0,0,.2);border-radius:.3em;white-space:nowrap;z-index:2}
.tk{width:25cqw;min-height:18cqw;font-size:1.65cqw;padding:1.1em 1.1em 1.4em;font-family:var(--f-hand);line-height:1.2;box-shadow:0 .8cqw 1.4cqw rgba(0,0,0,.28);color:#1F2A44}
.tk.y{background:#FFF59D}.tk.b{background:#B3E5FC}.tk.p{background:#F8BBD0}.tk.g{background:#C8E6C9}
.tk-n{font-weight:700;font-size:1.05em;border-bottom:.08em solid rgba(0,0,0,.25);margin-bottom:.3em}
.tk-t{white-space:pre-line;font-size:.98em}
/* trifold */
.tf-table{left:0;right:0;bottom:0;height:16%;background:linear-gradient(#E9E4DA,#CFC8BA);border-top:.4cqw solid #BDB5A6}
.tf{width:90cqw;font-size:1.05cqw;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:0;font-family:var(--f-body);color:#1F2A44}
.tf>div{background:#F7F9FC;padding:1.2em;box-shadow:0 1cqw 2cqw rgba(0,0,0,.25);border:.3em solid #2B50D8}
.tf-l{transform:perspective(60cqw) rotateY(14deg);transform-origin:right}
.tf-r{transform:perspective(60cqw) rotateY(-14deg);transform-origin:left}
.tf b{display:block;background:#2B50D8;color:#fff;padding:.15em .5em;margin:.5em 0 .3em;font-size:1.05em}
.tf p{margin:0;line-height:1.35}
.tf ul{margin:.2em 0;padding-left:1.2em}
.tf h5{font-family:var(--f-display);font-size:2.4em;margin:0;text-align:center;line-height:1;color:#C8361D;text-transform:uppercase}
.tf-by{text-align:center;font-size:.85em;color:#555;margin:.3em 0 .6em}
.tf-dia svg,.tf-graph svg{width:100%;height:auto;display:block;background:#fff;border:1px solid #CCD}
/* boards on a wall */
.fp{width:38cqw;font-size:1.45cqw;background:linear-gradient(160deg,#FFF3C4,#FFD9A8);color:#3A2A1E;padding:1.4em 1.6em;box-shadow:0 1.2cqw 2cqw rgba(0,0,0,.3);font-family:var(--f-body)}
.fp-t{font-family:var(--f-display);font-size:2.6em;font-weight:900;color:#C8361D;line-height:1}
.fp-s{font-size:.75em;color:#7A5A3A;margin:.2em 0 .6em}
.fp ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:.35em}
.mb{width:40cqw;font-size:1.3cqw;background:#1F3A5F;color:#F4F1E8;padding:1.2em 1.4em;box-shadow:0 1.2cqw 2cqw rgba(0,0,0,.3);border:.4em solid #C9A06B;font-family:var(--f-body)}
.mb h5{font-family:var(--f-display);font-size:2.1em;margin:0;color:#FFD27A;text-transform:uppercase}

  return `<${tag} class="photo ${sel?"sel":""}" style="--r:${rot}deg" ${btn?`data-act="tsel" data-arg="${p.id}" aria-pressed="${sel}" aria-label="${p.animal} on ${p.bg}"`:""}>${sel?`<span class="clip">TRAIN</span>`:""}${res?`<span class="res ${res.ok?"ok":"no"}">Model: ${res.guess}</span>`:""}<div class="img ${p.bg}">${animalSVG(p.animal)}</div>${label?`<span class="lbl">${p.animal}</span>`:""}</${tag}>`;
}

function botReply(sc,item){
  if(item&&item.kind==="lines") return botMsg((sc.intro?esc(sc.intro)+" ":"")+sentences(item.lines)+(sc.outro?" "+esc(sc.outro):""));
  if(sc.replyHtml) return botMsg(sc.replyHtml);
  if(sc.reply) return botMsg(esc(sc.reply).replace(/\n/g,"<br>"));
  return "";
}
function threadHTML(sc,item){
  let h=(sc.before||[]).map(m=>m.u!==undefined?`<div class="u-msg">${esc(m.u)}</div>`:botMsg(esc(m.b))).join("");
  h+=sc.ask?`<div class="u-msg">${esc(sc.ask)}</div>`:"";
  h+=botReply(sc,item);
  (sc.more||[]).forEach(m=>{ h+=m.u!==undefined?`<div class="u-msg">${esc(m.u)}</div>`:botMsg(esc(m.b)); });
  return h;
}

function cellHTML(c){
  if(c&&typeof c==="object"){
    if(c.meter!==undefined) return `<span class="meter"><i style="width:${+c.meter}%"></i></span>${+c.meter}%${c.flag?`<br><span class="flagword">${esc(c.flag)}</span>`:""}`;
    if(c.pill) return `<span class="pill ${/adv|pass|ok|approve|show/i.test(c.pill)?"adv":"rej"}">${esc(c.pill)}</span>`;
  }

}

  {q:"What's the largest planet in our solar system?",c:["A student is making a poster for science class."],f:["Jupiter is the largest planet in our solar system.","It's a gas giant made mostly of hydrogen and helium.","Its Great Red Spot is a giant storm that has lasted for centuries.","Jupiter has dozens of known moons, including Ganymede, the largest moon in the solar system."],w:[{s:"Jupiter is about twice as wide as Earth.",e:"Jupiter is about 11 times wider than Earth.",t:"Wrong number"},{s:"Jupiter is the closest planet to the Sun, which is why it looks so bright.",e:"Mercury is closest to the Sun. Jupiter is the fifth planet and looks bright because it's huge.",t:"Wrong fact"}]},

  {q:"What causes tides?",c:["A student is planning a beach trip and got curious."],f:["Tides are caused mainly by the Moon's gravity pulling on Earth's oceans.","The Sun's gravity affects tides too, but less than the Moon's.","Many coastlines get two high tides and two low tides about every day.","Extra-high spring tides happen when the Sun, Moon and Earth line up."],w:[{s:"Tides happen because wind pushes ocean water toward the shore twice a day.",e:"Wind makes waves, not tides. Tides come from the pull of the Moon and Sun.",t:"Wrong cause",x:[0]}]},

  {q:"When did World War II end?",c:["A student is building a timeline for World History."],f:["World War II ended in 1945.","Germany surrendered in May 1945.","Japan surrendered in August 1945, after the atomic bombings of Hiroshima and Nagasaki.","The United Nations was founded later that year."],w:[{s:"The war ended in 1918 with the Treaty of Versailles.",e:"That's World War I, which ended in 1918. World War II ended in 1945.",t:"Mixed-up facts",x:[0]}]},

  {q:"Why do leaves change color in fall?",c:["A student is writing a nature journal entry."],f:["Leaves are green because of chlorophyll, which plants use for photosynthesis.","In fall, shorter days and cooler temperatures cause many trees to stop making chlorophyll.","As the green fades, yellow and orange pigments called carotenoids become visible.","Some trees also make red pigments called anthocyanins in the fall."],w:[{s:"Frost paints the leaves red and orange when temperatures drop below freezing.",e:"Frost doesn't color leaves. The colors come from pigments that show up or form as chlorophyll breaks down.",t:"Common myth"}]},
  {q:"What is the Pythagorean theorem?",c:["A student is stuck on geometry homework."],f:["The Pythagorean theorem applies to right triangles.","It says a² + b² = c², where c is the hypotenuse.","The hypotenuse is the side across from the right angle, and it's the longest side.","For example, a triangle with legs 3 and 4 has a hypotenuse of 5."],w:[{s:"For example, a triangle with legs 3 and 4 has a hypotenuse of 7.",e:"3² + 4² = 25, and √25 = 5. Adding the legs (3 + 4) is a common mistake.",t:"Math error",x:[3]},{s:"It works for every triangle, not just right triangles.",e:"The theorem only holds for right triangles.",t:"Overclaim",x:[0]}]},

  {q:"Who was Harriet Tubman?",c:["A student is researching for Black History Month."],f:["Harriet Tubman was born into slavery in Maryland.","She escaped to freedom in 1849.","She returned many times to guide others to freedom on the Underground Railroad.","During the Civil War, she worked for the Union Army as a scout and spy."],w:[{s:"The Underground Railroad was a secret train line that ran under major cities.",e:"It wasn't a real railroad. It was a network of people and safe houses that helped enslaved people escape.",t:"Common myth"}]},

  {q:"How do magnets work?",c:["A student is doing a physics lab with magnets."],f:["Every magnet has a north pole and a south pole.","Opposite poles attract, and like poles repel.","Earth acts like a giant magnet, which is why compasses work.","Iron, nickel and cobalt are strongly attracted to magnets."],w:[{s:"Magnets attract all metals, including aluminum and copper.",e:"Most metals, including aluminum and copper, aren't noticeably attracted to magnets.",t:"Overclaim",x:[3]}]},

  return {sig:"live:"+C[0]+q,ask:q==="weather"?`What's the weather in ${C[0]} right now?`:q==="traffic"?`How's traffic in ${C[0]} right now?`:`Is anything happening in ${C[0]} tonight?`,c:`A student is heading to ${C[0]} later today.`,lines:[fake,C[1],"Conditions can change quickly, so plan ahead."],wrong:0,tag:"No live data",explain:"A chatbot without a live search tool can't see what's happening right now. It may still invent a confident answer. For anything current, use a source that updates."};
}

function choiceItem(sig,l,c,q,o,a,e,sc){ const order=shuffle(o.map((_,i)=>i)); return {sig,kind:"choice",label:l,context:c,q,opts:order.map(i=>o[i]),answer:order.indexOf(a),explain:e,scene:sc}; }
const HOW={
  hiring(){ const job=pick(["Software Engineer II","Data Analyst","Mechanical Engineer","Sales Manager"]); const kw=pick(["women's coding club","women's soccer captain","Girls Who Build mentor","women's chess team"]); const yrs=rint(8,12);
    return choiceItem("how:hiring"+job,"Hiring tool",`A company's HR team uses this screening tool to sort applications for ${job}.`,`The tool was trained on the résumés of people the company hired over the past ${yrs} years. Most of those hires were men. What's the most likely problem?`,["It will be fair, because computers don't have opinions","It may learn to prefer résumés that look like past hires, including men's","It will refuse to make any decisions","It will only pick people with perfect grades"],1,"A model copies patterns in its data, including unfair ones. Look at the dashboard: one applicant's score was lowered for a phrase that mentions women. Amazon reportedly dropped a résumé screener in 2018 after it learned to rate résumés lower when they mentioned women's groups.",
      {kind:"dashboard",place:"office",app:"TalentRank",title:"Applicant screening",right:job,note:`Model trained on hiring decisions from the last ${yrs} years`,cols:["Applicant","Experience","Match to past hires","Decision"],rows:shuffle([[`A-${rint(1000,1099)}`,`${rint(4,9)} yrs`,{meter:rint(85,96)},{pill:"Advance"}],[`A-${rint(1100,1199)}`,`${rint(6,10)} yrs`,{meter:rint(30,45),flag:`Lowered: “${kw}”`},{pill:"Reject"}],[`A-${rint(1200,1299)}`,`${rint(4,8)} yrs`,{meter:rint(80,92)},{pill:"Advance"}],[`A-${rint(1300,1399)}`,`${rint(3,9)} yrs`,{meter:rint(33,52)},{pill:"Reject"}]])}); },
  face(){ return choiceItem("how:face","Face unlock",`A new phone's face unlock works for the people who built it. Your friend has tried ${rint(3,6)} times.`,"It fails much more often for people with darker skin. What's the most likely cause?",["Phone cameras can't photograph darker skin","The training photos didn't include enough variety of faces","Those users are holding their phones wrong","Face unlock always fails randomly"],1,"If some groups are missing from the training data, the model performs worse for them. A 2018 study called Gender Shades found commercial face systems made far more errors on darker-skinned women than on lighter-skinned men.",{kind:"lock",day:day(),tries:rint(3,6)}); },
  accuracy(){ const N=pick([1000,2000,5000]); const sick=N/100; const brand=pick(["MedScan AI","Diagnova","ClearCheck","PulseRead"]);
    return choiceItem("how:acc"+brand+N,"Accuracy claim","A startup is pitching its medical AI to a hospital board.","The model detects a rare disease and scores 99% accuracy on its test. Why might that still be useless?",["99% is too low to count","If 99% of test patients are healthy, a model that always says “healthy” also scores 99%","Accuracy scores are always made up","Tests only matter for chatbots"],1,`A single accuracy number can hide what matters. The slide's small print says only ${sick} of the ${N.toLocaleString()} test patients had the disease. You need to know how the model does on those patients.`,{kind:"slide",brand,big:"99%",sub:"accurate at detecting the disease",foot:`Test set: ${N.toLocaleString()} patients · ${(N-sick).toLocaleString()} healthy, ${sick} with the disease`}); },
  responsible(){ const v=pick([["City's benefits algorithm wrongly flagged 1,200 families as fraud risks","Families who were flagged had their food assistance paused for weeks while they waited for a human review."],["School bus routing software left 300 students without a stop","Parents spent the first week of school driving kids across town after the new system removed dozens of stops."],["Rental screening tool rejected applicants over old, cleared records","Several renters were denied apartments because of court records that had been sealed years ago."]]);
    return choiceItem("how:resp"+v[0].slice(0,20),"Responsibility","A news story about an automated system that made decisions about people.","An AI system makes an unfair decision about someone. Who is responsible?",["Nobody, it's just math","The AI itself","The people and organizations who build, choose and use it","Only the person who typed the request"],2,"An AI doesn't choose its own data or where it gets used. People do. That means people can test it, question it and fix it.",{kind:"article",place:nextPlace(),device:"tablet",outlet:pick(["Metro Daily","River City Tribune","The Valley Ledger"]),headline:v[0],byline:person(),paras:[v[1],"When residents asked who was responsible, the city said the software vendor built the system. The vendor said the city chose how to use it.","“Nobody would tell us who decided,” said one parent."]}); },
  images(){ const v=pick([["a doctor","Man",["white coat","stethoscope","glasses","clipboard","scrubs"]],["a nurse","Woman",["scrubs","clipboard","name badge","stethoscope","blue scrubs"]],["a CEO","Man",["suit","tie","suit and tie","office","gray suit"]],["a scientist","Man",["lab coat","goggles","beaker","lab coat","microscope"]]]);
    return choiceItem("how:img"+v[0],"Generated images",`A student typed “${v[0]}” into an image generator eight times.`,"Why might every result look so similar?",[`Every ${v[0].slice(2)} really looks the same`,"The generator learned patterns from its training images, including stereotypes","The student typed it wrong","Image generators pick pictures at random"],1,"Image generators copy patterns in their training data. If those images over-represent some people in certain jobs, the outputs will too, unless the tool is designed to correct for it.",{kind:"imggrid",query:v[0],tiles:Array.from({length:8},()=>`${v[1]}, ${pick(["30s","40s","50s","60s"])}, ${pick(v[2])}`)}); },
  feed(){ const g=pick(["SkyForge","Pixel Raiders","Moonlight Racer","CraftQuest","Turbo Kart Arena"]);
    return choiceItem("how:feed"+g,"For You page",`A student watched three videos about ${g} last night.`,"Why is the app now showing so many similar videos?",["The app reads your text messages","Its recommendation system learns from what you watch and shows more of it","Everyone sees the same feed","The videos are ads you paid for"],1,"Recommendation algorithms predict what will keep you watching based on what you've watched before. That can narrow what you see, so it's worth searching for other things on purpose.",{kind:"feed",app:pick(["Clipz","Reelio","Snapstream"]),rows:pickN([`Top 10 ${g} tricks nobody knows`,`I beat ${g} without jumping`,`${g} speedrun world record?!`,`Why ${g} is the best game of the year`,`${g} funny moments compilation`,`${g} update: everything new`,`Ranking every ${g} level`],5).map(t=>({t,by:`@${pick(["gamegrind","pixelpatty","runfast","reviewroom","lolclips","levelup"])} · ${rint(1,9)}.${rint(0,9)}M views`}))}); },
  local(){ const town=pick(TOWNS);
    return choiceItem("how:local"+town,"Local history",`A student asked HelperBot about the history of ${town}, a small town.`,"Why might the chatbot know much less about a small town than about Paris?",["It doesn't like small towns","There's far less text about the small town in its training data","Small towns have no history","It's blocked from talking about towns"],1,"Language models learn from huge amounts of text. Places, people and languages written about less online are covered less well, and the model may fill gaps with vague guesses, like this reply.",{kind:"bot",device:"laptop",place:nextPlace(),ask:`Tell me the history of ${town}.`,reply:`${town} is a small community with a rich history. Like many towns, it grew around local industry and agriculture, and today it is known for its friendly residents and scenic views.`}); },
  cutoff(){ const ev=pick(["the regional robotics competition","the state basketball final","the city council vote on the new skate park","the science olympiad"]);
    return choiceItem("how:cut"+ev,"Knowledge cutoff","A student asked about something that happened last week.","What does HelperBot's answer tell you?",["Nothing happened last week","The model learned from data up to a certain date and may not know recent events","The chatbot is lying","The event was fake"],1,"Language models are trained on data up to a cutoff date. Unless they have a live search tool, they may not know recent events, so check a current news source.",{kind:"bot",device:"phone",ask:`Who won ${ev} last week?`,reply:"I don't have information about events that recent. My training data only goes up to a certain date, so I'd suggest checking the official website or local news."}); },
  random(){ const v=pick([["Give me a name for our bake sale stand","How about Crumbs & Cash? It's catchy and tells people right away that everything's for sale.","Try The Sweet Spot! It's friendly, easy to remember, and fits any kind of treat."],["Name our robotics team","How about Gear Pressure? It's fun and sounds a little intimidating.","Try Circuit Breakers! It's punchy and easy to chant."],["Suggest a theme for homecoming","How about A Night Under the Stars? It's easy to decorate for.","Try Decades Dance! Everyone dresses from a different era."],["Give me a title for my story about a lost dog","How about Finding Biscuit? It's simple and warm.","Try The Long Way Home. It hints at an adventure."]]);
    return choiceItem("how:rand"+v[0],"Same prompt, twice","Two friends typed the exact same prompt on their phones at the same time.","Why can the same prompt give a different answer each time?",["It looks up a different website each time","It picks from many likely next words, so there's built-in randomness","It remembers that you were annoyed","A person is typing the answers"],1,"Language models generate text one piece at a time, choosing from likely options. Small random choices early on can lead to quite different answers.",{kind:"bot2",ask:v[0],a:v[1],b:v[2]}); },
  plag(){ return choiceItem("how:plag"+rint(1,999),"Plagiarism flag","The school's AI tool flagged a student's essay.","What's the fairest next step?",["Give the student a zero right away","Have the teacher look at the evidence and talk with the student, including their drafts","Ignore the flag completely","Let the AI decide the grade"],1,"Automated tools make mistakes. A fair process has a person review the evidence and hear from the student before any decision.",{kind:"dashboard",place:"office",app:"EssayGuard",title:"Integrity review",right:pick(["English 10","English 9","AP Lang"]),url:"essayguard.example/review",cols:["Student","Essay","AI likelihood","Status"],rows:[[`S-${rint(2000,2999)}`,"Personal narrative",{meter:rint(85,96)},{pill:"Flagged"}],[`S-${rint(3000,3999)}`,"Personal narrative",{meter:rint(5,20)},{pill:"OK"}],[`S-${rint(4000,4999)}`,"Personal narrative",{meter:rint(25,40)},{pill:"OK"}]]}); },
  translate(){ return choiceItem("how:translate","Translation","A student translated two sentences from Turkish, which uses one gender-neutral word for he and she.","Why did the translation pick “he” and “she” this way?",["Turkish has separate words for he and she","The model learned from text where doctors were more often called he and nurses she","The student typed it wrong","Translations are always random"],1,"In Turkish, “o” can mean he or she. The model filled in genders based on patterns in its training text, which can repeat stereotypes about jobs.",{kind:"bot",device:"laptop",place:nextPlace(),ask:"Translate from Turkish: “O bir doktor. O bir hemşire.”",reply:"He is a doctor. She is a nurse."}); },
  voiceacc(){ const f=pick(FN); return choiceItem("how:voice"+f,"Voice assistant",`A voice assistant understands most classmates easily, but it keeps mishearing ${f}, who has a strong accent.`,"What's the most likely reason?",[`${f} is speaking wrong`,"The assistant was trained on too few voices with accents like theirs","Voice assistants only work in quiet rooms","The microphone is broken"],1,"Speech systems learn from recordings. Accents that are under-represented in that data get recognized less accurately.",{kind:"bot",device:"phone",ask:"[voice] set a timer for tin minutes",reply:"Sorry, I didn't catch that. Did you mean “set a timer for tin”?"}); },
  spam(){ return choiceItem("how:spam","Spam filter","The school's email filter sent an important announcement to spam.","Why might the filter have done this?",["Someone at school hates tutoring","It learned that words like “free” often appear in spam, so it flagged a real message","Spam filters read your mind","The email was actually a scam"],1,"Filters learn patterns from past spam. A word that often shows up in scams can trigger a false alarm on a real message. That's called a false positive.",{kind:"email",place:nextPlace(),from:"Counseling Office",fromAddr:"counseling@school.example",to:"All students",subject:"[Marked as spam] FREE tutoring every Tuesday!",body:`FREE tutoring is available every Tuesday after school in the library. Sign up at the front office. Space is limited, so act now!\n\n— ${pick(["Ms. Reyes","Mr. Walsh","Mrs. Patel"])}, School Counselor`}); },
  predict(){ return choiceItem("how:predict","Prediction model","A model predicts how many students will eat school lunch each day, using the last five years of data.","This year the school added a new late-start schedule. Why might the model's predictions get worse?",["Models never make mistakes","It learned from old patterns that may no longer match the new schedule","Students eat randomly","The model got tired"],1,"Models assume the future looks like their training data. When something important changes, their predictions can drift off until they're updated with new data.",{kind:"slide",brand:"LunchCount AI",big:"±4%",sub:"average daily prediction error",foot:"Trained on 2019–2024 attendance · New bell schedule starts this fall",bars:[40,55,70,92],barl:["Mon","Tue","Wed","Thu"]}); },
  nextword(){ return choiceItem("how:next","How chatbots work","A student wonders how HelperBot comes up with its answers.","What is a chatbot like HelperBot mainly doing when it answers?",["Looking up the one correct answer in a database","Predicting likely next words based on patterns in the text it learned from","Copying a human expert's notes","Reading your mind"],1,"Language models generate text by predicting what's likely to come next. That's why they can sound fluent and still be wrong.",{kind:"bot",device:"phone",ask:"How do you know so much?",reply:"I don't “know” things the way people do. I learned patterns from a huge amount of text, and I generate responses by predicting which words are likely to come next."}); },
  moderation(){ return choiceItem("how:mod","Comment filter","A video app's AI filter flags comments as “toxic.”","Some students notice it flags harmless slang from their community much more often. What could explain that?",["Their slang is actually toxic","The people who labeled the training data may not have understood that slang","Filters are always perfect","It's a coincidence"],1,"Filters learn from examples people labeled. If labelers misread a dialect or slang, the model learns to flag it unfairly.",{kind:"dashboard",place:nextPlace(),app:"SafeChat",title:"Flagged comments",right:"Last 24 hours",url:"safechat.example/review",cols:["Comment","Toxicity score","Action"],rows:[["“that game was fire fr”",{meter:rint(70,88)},{pill:"Hidden"}],["“no cap this is the best video”",{meter:rint(62,80)},{pill:"Hidden"}],["“great video, thanks!”",{meter:rint(2,9)},{pill:"Shown"}]]}); }
